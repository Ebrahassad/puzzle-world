workflows:
  android-workflow:
    name: Puzzle World Android Release

    environment:
      flutter: stable

    scripts:

      - name: Reset pub cache
        script: |
          flutter clean
          rm -rf ~/.pub-cache/hosted/pub.dev/google_mobile_ads-5.3.1
          rm -f pubspec.lock

      - name: Get packages
        script: |
          flutter pub get

      - name: Check ads version
        script: |
          flutter pub deps | grep google_mobile_ads

      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons

      - name: Generate native splash
        script: |
          dart run flutter_native_splash:create

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk