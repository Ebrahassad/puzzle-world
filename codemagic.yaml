workflows:
  android-workflow:
    name: Puzzle World Test APK

    environment:
      flutter: stable

    scripts:

      - name: Clean
        script: |
          flutter clean

      - name: Get packages
        script: |
          flutter pub get

      - name: Generate Launcher Icons
        script: |
          dart run flutter_launcher_icons

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk