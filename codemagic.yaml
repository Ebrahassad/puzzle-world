workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: 3.44.8
      groups:
        - android_signing

    scripts:

      # ============================================================
      # 1. Flutter
      # ============================================================

      - name: Flutter version
        script: |
          set -e

          flutter --version
          flutter doctor -v


      # ============================================================
      # 2. Create Android project from scratch
      # ============================================================

      - name: Create Android project
        script: |
          set -e

          echo "============================================================"
          echo "CREATING ANDROID PROJECT"
          echo "============================================================"

          if [ ! -d "android" ]; then

            flutter create \
              --platforms=android \
              --org com.ebrahassadi \
              --project-name puzzle_world \
              .

          else

            echo "Android folder already exists."

          fi


      # ============================================================
      # 3. Configure Gradle 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING GRADLE 8.14"
          echo "============================================================"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")

          text = path.read_text()

          output = []

          for line in text.splitlines():

              if line.startswith("distributionUrl="):

                  output.append(
                      "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip"
                  )

              else:

                  output.append(line)

          path.write_text(
              "\n".join(output) + "\n"
          )

          print("Gradle 8.14 configured.")
          PY

          grep "distributionUrl" "$WRAPPER"


      # ============================================================
      # 4. Configure AGP 8.6.1 + Kotlin 2.0.21
      # ============================================================

      - name: Configure AGP and Kotlin
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING AGP 8.6.1 AND KOTLIN 2.0.21"
          echo "============================================================"

          SETTINGS="android/settings.gradle.kts"

          if [ ! -f "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")

          text = path.read_text()

          # --------------------------------------------------------
          # Android Application Plugin
          # --------------------------------------------------------

          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.6.1\g<2>',
              text
          )

          # --------------------------------------------------------
          # Android Library Plugin
          # --------------------------------------------------------

          text = re.sub(
              r'(id\("com\.android\.library"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.6.1\g<2>',
              text
          )

          # --------------------------------------------------------
          # Kotlin Android Plugin
          # --------------------------------------------------------

          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              r'\g<1>2.0.21\g<2>',
              text
          )

          path.write_text(text)

          print("AGP and Kotlin configured.")
          PY

          echo ""
          echo "Configured plugins:"

          grep -n \
            -E "com.android.application|com.android.library|org.jetbrains.kotlin.android" \
            "$SETTINGS" || true


      # ============================================================
      # 5. Verify versions BEFORE continuing
      # ============================================================

      - name: Verify Android build tool versions
        script: |
          set -e

          echo "============================================================"
          echo "VERIFYING ANDROID BUILD TOOLS"
          echo "============================================================"

          echo ""
          echo "Gradle:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Android/Kotlin plugins:"
          grep -n \
            -E "com.android.application|com.android.library|org.jetbrains.kotlin.android" \
            android/settings.gradle.kts || true

          if grep -q "gradle-9" \
            android/gradle/wrapper/gradle-wrapper.properties; then

            echo "ERROR: Gradle 9 detected."
            exit 1

          fi

          if grep -q \
            'id("com.android.application") version "9.' \
            android/settings.gradle.kts; then

            echo "ERROR: AGP 9.x is still present."
            exit 1

          fi

          echo ""
          echo "Android build tools look correct."


      # ============================================================
      # 6. Flutter pub get
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 7. Verify application ID
      # ============================================================

      - name: Verify application ID
        script: |
          set -e

          echo "============================================================"
          echo "VERIFYING APPLICATION ID"
          echo "============================================================"

          grep -R \
            -E "namespace|applicationId" \
            android/app/build.gradle.kts \
            android/app/build.gradle \
            2>/dev/null || true


      # ============================================================
      # 8. Install launcher icon
      # ============================================================

      - name: Install launcher icon
        script: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          echo "============================================================"
          echo "INSTALLING PUZZLE WORLD ICON"
          echo "============================================================"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Icon not found:"
            echo "$SOURCE"
            exit 1
          fi

          rm -rf "$RES"/mipmap-*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            mkdir -p "$RES/mipmap-$density"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo "Launcher icon installed."


      # ============================================================
      # 9. Remove adaptive icons
      # ============================================================

      - name: Remove adaptive icons
        script: |
          set -e

          RES="android/app/src/main/res"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            -delete || true

          find "$RES" \
            -type d \
            \( \
              -name "mipmap-anydpi" \
              -o -name "mipmap-anydpi-v26" \
              -o -name "mipmap-anydpi-v27" \
              -o -name "drawable-anydpi-v24" \
            \) \
            -exec rm -rf {} + || true

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          echo "Adaptive icons removed."


      # ============================================================
      # 10. Configure Android Manifest
      # ============================================================

      - name: Configure Android Manifest
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              """<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round\"""",
              1
          )

          path.write_text(text)

          print("Manifest configured.")
          PY


      # ============================================================
      # 11. Create release keystore
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          echo "============================================================"
          echo "CREATING RELEASE KEYSTORE"
          echo "============================================================"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore created successfully."


      # ============================================================
      # 12. Create key.properties
      # ============================================================

      - name: Create key properties
        script: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # 13. Configure release signing
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: build.gradle.kts not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          text = path.read_text()

          # --------------------------------------------------------
          # Java imports
          # --------------------------------------------------------

          if "import java.util.Properties" not in text:

              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )


          # --------------------------------------------------------
          # Keystore loader
          # --------------------------------------------------------

          if "val keystorePropertiesFile" not in text:

              loader = """
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )


          # --------------------------------------------------------
          # Signing config
          # --------------------------------------------------------

          if 'create("release")' not in text:

              signing = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          """

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )


          # --------------------------------------------------------
          # Release signing
          # --------------------------------------------------------

          text = text.replace(
              "signingConfig = signingConfigs.debug",
              'signingConfig = signingConfigs.getByName("release")'
          )

          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("release")""",
                  1
              )


          path.write_text(text)

          print("Release signing configured.")
          PY


      # ============================================================
      # 14. Configure Java 17
      # ============================================================

      - name: Configure Java 17
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)

          print("Java 17 configured.")
          PY


      # ============================================================
      # 15. Unity Ads compatibility
      # ============================================================

      - name: Configure Unity Ads
        script: |
          set -e

          echo "============================================================"
          echo "CHECKING UNITY ADS"
          echo "============================================================"

          UNITY_PATH=""

          while IFS= read -r path
          do

            UNITY_PATH="$path"
            break

          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PATH"

            if [ -d "$UNITY_PATH/android" ]; then

              find "$UNITY_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' FILE
              do

                sed -i \
                  -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$FILE" || true

                sed -i \
                  -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                  "$FILE" || true

              done

            fi

          else

            echo "Unity Ads plugin not found in cache."
            echo "Continuing."

          fi


      # ============================================================
      # 16. Verify everything
      # ============================================================

      - name: Final Android verification
        script: |
          set -e

          echo "============================================================"
          echo "FINAL VERIFICATION"
          echo "============================================================"

          echo ""
          echo "Gradle:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Plugins:"
          grep -n \
            -E "com.android.application|org.jetbrains.kotlin.android" \
            android/settings.gradle.kts || true

          echo ""
          echo "Signing:"
          test -s android/app/upload-keystore.jks
          test -s android/key.properties
          echo "OK"

          echo ""
          echo "Icons:"
          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \) \
            | sort

          echo ""
          echo "Manifest:"
          grep -E \
            "android:icon|android:roundIcon" \
            android/app/src/main/AndroidManifest.xml \
            || true


      # ============================================================
      # 17. Clean
      # ============================================================

      - name: Flutter clean
        script: |
          set -e

          flutter clean


      # ============================================================
      # 18. Pub get
      # ============================================================

      - name: Flutter pub get final
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 19. Build APK
      # ============================================================

      - name: Build release APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"


    # ================================================================
    # APK ARTIFACT
    # ================================================================

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk


    # ================================================================
    # EMAIL
    # ================================================================

    publishing:
      email:
        recipients:
          - ebrahassadi@gmail.com
        notify:
          success: true
          failure: true