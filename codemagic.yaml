workflows:
  android-workflow:
    name: Puzzle World Android Release

    environment:
      flutter: stable

    scripts:

      - name: Clean project
        script: |
          flutter clean
          rm -f pubspec.lock
          flutter pub cache repair

      - name: Get packages
        script: |
          flutter pub get

      - name: Verify google_mobile_ads version
        script: |
          flutter pub deps | grep google_mobile_ads

      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons

      - name: Generate native splash
        script: |
          dart run flutter_native_splash:create

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk