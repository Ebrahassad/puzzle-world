workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: 3.44.8
      groups:
        - android_signing

    scripts:

      # ============================================================
      # Flutter
      # ============================================================

      - name: Flutter version
        script: |
          set -e

          flutter --version
          flutter doctor -v


      # ============================================================
      # Create Android project from scratch if missing
      # ============================================================

      - name: Create Android project
        script: |
          set -e

          if [ ! -d "android" ]; then

            echo "============================================================"
            echo "ANDROID FOLDER NOT FOUND"
            echo "CREATING ANDROID PROJECT FROM SCRATCH"
            echo "============================================================"

            flutter create \
              --platforms=android \
              --org com.ebrahassadi \
              --project-name puzzle_world \
              .

          else

            echo "Android folder already exists."
            echo "Skipping flutter create."

          fi


      # ============================================================
      # Pub Get
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e

          flutter pub get


      # ============================================================
      # Configure Gradle 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        script: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = path.read_text()

          lines = []

          for line in text.splitlines():
              if line.startswith("distributionUrl="):
                  lines.append(
                      "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip"
                  )
              else:
                  lines.append(line)

          path.write_text("\n".join(lines) + "\n")

          print("Gradle wrapper configured to 8.14.")
          PY

          grep "distributionUrl" "$WRAPPER"


      # ============================================================
      # Configure Android launcher icon
      # ============================================================

      - name: Install launcher icon
        script: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: $SOURCE does not exist."
            exit 1
          fi

          echo "Installing original launcher icon..."

          rm -rf "$RES"/mipmap-*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            mkdir -p "$RES/mipmap-$density"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo "Launcher icon installed without modification."


      # ============================================================
      # Remove adaptive icons
      # ============================================================

      - name: Remove adaptive icons
        script: |
          set -e

          RES="android/app/src/main/res"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            -delete || true

          find "$RES" \
            -type d \
            \( \
              -name "mipmap-anydpi" \
              -o -name "mipmap-anydpi-v26" \
              -o -name "mipmap-anydpi-v27" \
              -o -name "drawable-anydpi-v24" \
            \) \
            -exec rm -rf {} + || true

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          echo "Adaptive icon resources removed."


      # ============================================================
      # Configure Android Manifest
      # ============================================================

      - name: Configure Android launcher icon
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              '<application',
              '<application\n'
              '        android:icon="@mipmap/ic_launcher"\n'
              '        android:roundIcon="@mipmap/ic_launcher_round"',
              1
          )

          path.write_text(text)

          print("AndroidManifest launcher icons configured.")
          PY


      # ============================================================
      # Verify application ID
      # ============================================================

      - name: Verify application ID
        script: |
          set -e

          echo "Checking application ID..."

          grep -R \
            -E 'namespace|applicationId' \
            android/app/build.gradle.kts \
            android/app/build.gradle \
            2>/dev/null || true


      # ============================================================
      # Create release keystore
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          echo "============================================================"
          echo "CREATING RELEASE KEYSTORE"
          echo "============================================================"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Keystore created successfully."


      # ============================================================
      # Create key.properties
      # ============================================================

      - name: Create key.properties
        script: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # Configure release signing
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # --------------------------------------------------------
          # Imports
          # --------------------------------------------------------

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          # --------------------------------------------------------
          # Keystore properties
          # --------------------------------------------------------

          if "val keystorePropertiesFile" not in text:

              loader = """
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          # --------------------------------------------------------
          # Signing config
          # --------------------------------------------------------

          if 'create("release")' not in text:

              signing = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          """

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          # --------------------------------------------------------
          # Release signing
          # --------------------------------------------------------

          text = text.replace(
              "signingConfig = signingConfigs.debug",
              'signingConfig = signingConfigs.getByName("release")'
          )

          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("release")""",
                  1
              )

          path.write_text(text)

          print("Release signing configured successfully.")
          PY


      # ============================================================
      # Java / Kotlin 17
      # ============================================================

      - name: Configure Java 17
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_21",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)

          print("Java/Kotlin target configured for Java 17.")
          PY


      # ============================================================
      # Verify signing
      # ============================================================

      - name: Verify signing configuration
        script: |
          set -e

          echo "============================================================"
          echo "VERIFYING SIGNING"
          echo "============================================================"

          if [ ! -f android/app/upload-keystore.jks ]; then
            echo "ERROR: upload-keystore.jks missing."
            exit 1
          fi

          if [ ! -f android/key.properties ]; then
            echo "ERROR: key.properties missing."
            exit 1
          fi

          echo "Keystore exists."
          echo "key.properties exists."

          echo ""
          echo "Alias:"
          keytool \
            -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore credentials verified."


      # ============================================================
      # Verify Gradle
      # ============================================================

      - name: Verify Gradle configuration
        script: |
          set -e

          echo "============================================================"
          echo "GRADLE CONFIGURATION"
          echo "============================================================"

          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # Flutter clean
      # ============================================================

      - name: Flutter clean
        script: |
          set -e

          flutter clean


      # ============================================================
      # Pub get final
      # ============================================================

      - name: Flutter pub get final
        script: |
          set -e

          flutter pub get


      # ============================================================
      # Build
      # ============================================================

      - name: Build release APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"


    # ==============================================================
    # APK ARTIFACT
    # ==============================================================

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk


    # ==============================================================
    # EMAIL
    # ==============================================================

    publishing:
      email:
        recipients:
          - ebrahassadi@gmail.com
        notify:
          success: true
          failure: true