workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: 3.44.8
      java: 17

      groups:
        - android_signing

      vars:
        PACKAGE_NAME: "com.ebrahassad.puzzle_world"

    scripts:

      # ============================================================
      # 1. Create Android project if it was deleted
      # ============================================================

      - name: Generate Android project
        script: |
          set -e

          echo "============================================================"
          echo "GENERATING ANDROID PROJECT"
          echo "============================================================"

          if [ ! -d "android" ]; then

            flutter create \
              --platforms=android \
              --org com.ebrahassad \
              --project-name puzzle_world \
              .

            echo "Android project created successfully."

          else

            echo "Android folder already exists."

          fi

      # ============================================================
      # 2. Flutter dependencies
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e
          flutter pub get

      # ============================================================
      # 3. Force Gradle 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        script: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip#' \
            "$WRAPPER"

          echo ""
          echo "Gradle configuration:"
          grep "distributionUrl" "$WRAPPER"

      # ============================================================
      # 4. Install launcher icon
      # ============================================================

      - name: Install Puzzle World launcher icon
        script: |
          set -e

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          echo "============================================================"
          echo "INSTALLING PUZZLE WORLD ICON"
          echo "============================================================"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Icon not found:"
            echo "$ICON"
            exit 1
          fi

          rm -rf "$RES"/mipmap-*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            mkdir -p "$RES/mipmap-$density"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo "Original PNG copied without modification."

      # ============================================================
      # 5. Remove adaptive icons
      # ============================================================

      - name: Remove adaptive icons
        script: |
          set -e

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete

          echo "Adaptive launcher resources removed."

      # ============================================================
      # 6. Configure AndroidManifest
      # ============================================================

      - name: Configure launcher manifest
        script: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i \
            's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' \
            "$MANIFEST"

          if grep -q "android:roundIcon=" "$MANIFEST"; then

            sed -i \
              's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' \
              "$MANIFEST"

          else

            sed -i \
              's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"#' \
              "$MANIFEST"

          fi

          echo "Manifest configured."

      # ============================================================
      # 7. Create release keystore
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore created successfully."

      # ============================================================
      # 8. Create key.properties
      # ============================================================

      - name: Create signing properties
        script: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."

      # ============================================================
      # 9. Configure release signing
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found."
              )

          text = path.read_text()

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          loader = """
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

          if "val keystorePropertiesFile" not in text:
              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          signing = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }

                      storePassword =
                          keystoreProperties["storePassword"] as String?
                  }
              }

          """

          if 'create("release")' not in text:
              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                  signingConfig =
                      signingConfigs.getByName("release")""",
                  1
              )

          path.write_text(text)

          print("Release signing configured successfully.")
          PY

      # ============================================================
      # 10. Java / Kotlin 17
      # ============================================================

      - name: Configure Java and Kotlin 17
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          sed -i \
            's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            "$FILE"

          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$FILE"

          sed -i \
            's/jvmTarget = "1.8"/jvmTarget = "17"/g' \
            "$FILE"

          sed -i \
            's/jvmTarget = "11"/jvmTarget = "17"/g' \
            "$FILE"

          echo "Java/Kotlin target configured."

      # ============================================================
      # 11. Unity Ads
      # ============================================================

      - name: Check Unity Ads plugin
        script: |
          set -e

          echo "Checking Unity Ads plugin..."

          find "$HOME/.pub-cache" \
            -type d \
            -path "*unity_ads_plugin*" \
            -print \
            2>/dev/null || true

          echo "Unity Ads check completed."

      # ============================================================
      # 12. Flutter clean
      # ============================================================

      - name: Flutter clean
        script: |
          set -e

          flutter clean
          flutter pub get

      # ============================================================
      # 13. Verify Gradle
      # ============================================================

      - name: Verify Gradle version
        script: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 14. Build release APK
      # ============================================================

      - name: Build Puzzle World APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk