workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
        - tag
        - pull_request

      branch_patterns:
        - pattern: main
          include: true

    environment:
      flutter: 3.44.8

      groups:
        - android_signing

    scripts:

      # ============================================================
      # 1. Flutter
      # ============================================================

      - name: Flutter version
        script: |
          set -e

          flutter --version
          dart --version


      # ============================================================
      # 2. Create Android project
      # ============================================================

      - name: Create Android project
        script: |
          set -e

          if [ ! -d "android" ]; then

            flutter create \
              --platforms=android \
              --org com.ebrahassadi \
              --project-name puzzle_world \
              .

          fi

          test -d android
          test -f android/app/build.gradle.kts


      # ============================================================
      # 3. Gradle
      # ============================================================

      - name: Configure Gradle
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          text = path.read_text()

          import re

          text = re.sub(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.1.0-bin.zip',
              text
          )

          path.write_text(text)
          PY

          grep distributionUrl \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 4. Android / Kotlin
      # ============================================================

      - name: Configure Android versions
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.11.1\g<2>',
              text
          )

          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              r'\g<1>2.2.20\g<2>',
              text
          )

          path.write_text(text)
          PY


      # ============================================================
      # 5. Dependencies
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 6. Launcher icon
      # ============================================================

      - name: Install launcher icon
        script: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          test -f "$SOURCE"

          rm -rf "$RES"/mipmap-*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            mkdir -p "$RES/mipmap-$density"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done


      # ============================================================
      # 7. Remove adaptive icons
      # ============================================================

      - name: Remove adaptive icons
        script: |
          set -e

          RES="android/app/src/main/res"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"


      # ============================================================
      # 8. Manifest
      # ============================================================

      - name: Configure Android Manifest
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              """<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round" """,
              1
          )

          path.write_text(text)
          PY


      # ============================================================
      # 9. Release signing
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          test -n "$KEYSTORE_BASE64"

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks


      - name: Create key properties
        script: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF


      # ============================================================
      # 10. Configure signing
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/build.gradle.kts"
          )

          text = path.read_text()

          if "import java.util.Properties" not in text:

              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          if "keystorePropertiesFile" not in text:

              loader = """
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          if 'create("release")' not in text:

              signing = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          """

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          text = text.replace(
              "signingConfig = signingConfigs.debug",
              'signingConfig = signingConfigs.getByName("release")'
          )

          if 'signingConfig = signingConfigs.getByName("release")' not in text:

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("release")""",
                  1
              )

          path.write_text(text)
          PY


      # ============================================================
      # 11. Java 17
      # ============================================================

      - name: Configure Java 17
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/build.gradle.kts"
          )

          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)
          PY


      # ============================================================
      # 12. Clean
      # ============================================================

      - name: Flutter clean
        script: |
          set -e

          flutter clean
          flutter pub get


      # ============================================================
      # 13. Verify package
      # ============================================================

      - name: Verify application ID
        script: |
          set -e

          echo "Expected package:"
          echo "com.ebrahassadi.puzzle_world"

          grep -R \
            "com.ebrahassadi" \
            android \
            || true


      # ============================================================
      # 14. Build APK
      # ============================================================

      - name: Build release APK
        script: |
          set -e

          flutter build apk \
            --release


      # ============================================================
      # 15. Build AAB
      # ============================================================

      - name: Build release AAB
        script: |
          set -e

          flutter build appbundle \
            --release


    artifacts:

      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab


    publishing:

      email:
        recipients:
          - ebrahassadi@gmail.com

        notify:
          success: true
          failure: true