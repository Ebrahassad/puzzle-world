workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: 3.44.8
      groups:
        - android_signing

    scripts:

      # ============================================================
      # 1. Flutter
      # ============================================================

      - name: Flutter version
        script: |
          set -e

          flutter --version
          flutter doctor -v


      # ============================================================
      # 2. Create Android project
      # ============================================================

      - name: Create Android project
        script: |
          set -e

          if [ ! -d "android" ]; then

            echo "============================================================"
            echo "ANDROID FOLDER NOT FOUND"
            echo "CREATING ANDROID PROJECT FROM SCRATCH"
            echo "============================================================"

            flutter create \
              --platforms=android \
              --org com.ebrahassadi \
              --project-name puzzle_world \
              .

          else

            echo "Android folder already exists."
            echo "Skipping flutter create."

          fi


      # ============================================================
      # 3. Configure Gradle 8.14 + AGP + Kotlin
      # ============================================================

      - name: Configure Android build tools
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING ANDROID BUILD TOOLS"
          echo "============================================================"

          # --------------------------------------------------------
          # Gradle 8.14
          # --------------------------------------------------------

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = path.read_text()

          lines = []

          for line in text.splitlines():

              if line.startswith("distributionUrl="):

                  lines.append(
                      "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip"
                  )

              else:

                  lines.append(line)

          path.write_text("\n".join(lines) + "\n")

          print("Gradle 8.14 configured.")
          PY


          # --------------------------------------------------------
          # AGP 8.6.1 + Kotlin 2.0.21
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle"),
              Path("android/build.gradle.kts"),
              Path("android/build.gradle"),
          ]

          for path in candidates:

              if not path.exists():
                  continue

              text = path.read_text()

              # AGP 9.x -> 8.6.1
              text = re.sub(
                  r'(com\.android\.application.*?version\s*[=:]\s*["\'])[^"\']+(["\'])',
                  r'\g<1>8.6.1\g<2>',
                  text
              )

              text = re.sub(
                  r'(com\.android\.library.*?version\s*[=:]\s*["\'])[^"\']+(["\'])',
                  r'\g<1>8.6.1\g<2>',
                  text
              )

              # Kotlin -> 2.0.21
              text = re.sub(
                  r'(org\.jetbrains\.kotlin\.android.*?version\s*[=:]\s*["\'])[^"\']+(["\'])',
                  r'\g<1>2.0.21\g<2>',
                  text
              )

              path.write_text(text)

              print(f"Updated: {path}")
          PY


          echo ""
          echo "============================================================"
          echo "GRADLE VERSION"
          echo "============================================================"

          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties


          echo ""
          echo "============================================================"
          echo "AGP / KOTLIN"
          echo "============================================================"

          grep -R \
            -E "com.android.application|com.android.library|org.jetbrains.kotlin.android" \
            android/settings.gradle.kts \
            android/settings.gradle \
            android/build.gradle.kts \
            android/build.gradle \
            2>/dev/null || true


      # ============================================================
      # 4. Flutter pub get
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 5. Verify application ID
      # ============================================================

      - name: Verify application ID
        script: |
          set -e

          echo "============================================================"
          echo "APPLICATION ID"
          echo "============================================================"

          grep -R \
            -E "namespace|applicationId" \
            android/app/build.gradle.kts \
            android/app/build.gradle \
            2>/dev/null || true


      # ============================================================
      # 6. Install normal PNG launcher icon
      # ============================================================

      - name: Install launcher icon
        script: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          echo "============================================================"
          echo "INSTALLING PUZZLE WORLD ICON"
          echo "============================================================"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Missing icon:"
            echo "$SOURCE"
            exit 1
          fi

          rm -rf "$RES"/mipmap-*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            mkdir -p "$RES/mipmap-$density"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo "Original PNG copied without modification."


      # ============================================================
      # 7. Remove adaptive icons
      # ============================================================

      - name: Remove adaptive icons
        script: |
          set -e

          RES="android/app/src/main/res"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            -delete || true

          find "$RES" \
            -type d \
            \( \
              -name "mipmap-anydpi" \
              -o -name "mipmap-anydpi-v26" \
              -o -name "mipmap-anydpi-v27" \
              -o -name "drawable-anydpi-v24" \
            \) \
            -exec rm -rf {} + || true

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          echo "Adaptive icons removed."


      # ============================================================
      # 8. Configure AndroidManifest
      # ============================================================

      - name: Configure launcher icon in manifest
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")

          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              """<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round\"""",
              1
          )

          path.write_text(text)

          print("AndroidManifest configured.")
          PY


      # ============================================================
      # 9. Create release keystore
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          echo "============================================================"
          echo "CREATING RELEASE KEYSTORE"
          echo "============================================================"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore created successfully."


      # ============================================================
      # 10. Create key.properties
      # ============================================================

      - name: Create key properties
        script: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # 11. Configure release signing
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # --------------------------------------------------------
          # Imports
          # --------------------------------------------------------

          if "import java.util.Properties" not in text:

              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )


          # --------------------------------------------------------
          # Keystore loader
          # --------------------------------------------------------

          if "val keystorePropertiesFile" not in text:

              loader = """
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )


          # --------------------------------------------------------
          # Signing configuration
          # --------------------------------------------------------

          if 'create("release")' not in text:

              signing = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          """

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )


          # --------------------------------------------------------
          # Release build signing
          # --------------------------------------------------------

          text = text.replace(
              "signingConfig = signingConfigs.debug",
              'signingConfig = signingConfigs.getByName("release")'
          )

          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("release")""",
                  1
              )


          path.write_text(text)

          print("Release signing configured.")
          PY


      # ============================================================
      # 12. Java 17 / Kotlin JVM
      # ============================================================

      - name: Configure Java 17
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)

          print("Java/Kotlin target set to 17.")
          PY


      # ============================================================
      # 13. Unity Ads JVM compatibility
      # ============================================================

      - name: Configure Unity Ads compatibility
        script: |
          set -e

          UNITY_PATH=""

          while IFS= read -r path
          do
            UNITY_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PATH" ]; then

            echo "Unity Ads plugin found:"
            echo "$UNITY_PATH"

            find "$UNITY_PATH/android" \
              -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print0 |
            while IFS= read -r -d '' FILE
            do

              echo "Checking:"
              echo "$FILE"

              sed -i \
                -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                "$FILE" || true

              sed -i \
                -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                "$FILE" || true

            done

          else

            echo "Unity Ads plugin path not found."
            echo "Continuing."

          fi


      # ============================================================
      # 14. Verify configuration
      # ============================================================

      - name: Verify Android configuration
        script: |
          set -e

          echo "============================================================"
          echo "GRADLE"
          echo "============================================================"

          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "============================================================"
          echo "SIGNING"
          echo "============================================================"

          test -f android/app/upload-keystore.jks
          test -f android/key.properties

          echo "Signing files exist."

          echo ""
          echo "============================================================"
          echo "ICONS"
          echo "============================================================"

          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \) \
            | sort

          echo ""
          echo "============================================================"
          echo "MANIFEST"
          echo "============================================================"

          grep -E \
            "android:icon|android:roundIcon" \
            android/app/src/main/AndroidManifest.xml \
            || true


      # ============================================================
      # 15. Flutter clean
      # ============================================================

      - name: Flutter clean
        script: |
          set -e

          flutter clean


      # ============================================================
      # 16. Final pub get
      # ============================================================

      - name: Flutter pub get final
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 17. Build APK
      # ============================================================

      - name: Build release APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"


    # ================================================================
    # ARTIFACT
    # ================================================================

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk


    # ================================================================
    # EMAIL
    # ================================================================

    publishing:
      email:
        recipients:
          - ebrahassadi@gmail.com
        notify:
          success: true
          failure: true