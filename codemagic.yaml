workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: push

    environment:
      flutter: 3.44.8
      groups:
        - android_signing

    scripts:

      # ============================================================
      # 1. Flutter
      # ============================================================

      - name: Flutter version
        script: |
          set -e

          flutter --version
          flutter doctor -v


      # ============================================================
      # 2. Create Android project from scratch
      # ============================================================

      - name: Create Android project
        script: |
          set -e

          echo "============================================================"
          echo "CREATING ANDROID PROJECT"
          echo "============================================================"

          if [ ! -d "android" ]; then

            flutter create \
              --platforms=android \
              --org com.ebrahassadi \
              --project-name puzzle_world \
              .

          else

            echo "Android folder already exists."

          fi


      # ============================================================
      # 3. Configure Gradle 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING GRADLE 8.14"
          echo "============================================================"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")

          text = path.read_text()

          lines = []

          for line in text.splitlines():

              if line.startswith("distributionUrl="):

                  lines.append(
                      "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip"
                  )

              else:

                  lines.append(line)

          path.write_text(
              "\n".join(lines) + "\n"
          )

          print("Gradle 8.14 configured.")
          PY

          grep "distributionUrl" "$WRAPPER"


      # ============================================================
      # 4. Configure AGP 8.6.1 / Kotlin 2.0.21
      # ============================================================

      - name: Configure AGP and Kotlin
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING AGP 8.6.1 / KOTLIN 2.0.21"
          echo "============================================================"

          FILE="android/settings.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.6.1\g<2>',
              text
          )

          text = re.sub(
              r'(id\("com\.android\.library"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.6.1\g<2>',
              text
          )

          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              r'\g<1>2.0.21\g<2>',
              text
          )

          path.write_text(text)

          print("AGP 8.6.1 and Kotlin 2.0.21 configured.")
          PY

          grep -n \
            -E "com.android.application|com.android.library|org.jetbrains.kotlin.android" \
            "$FILE" || true


      # ============================================================
      # 5. Flutter pub get
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 6. Launcher icon
      # ============================================================

      - name: Install launcher icon
        script: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          echo "============================================================"
          echo "INSTALLING PUZZLE WORLD ICON"
          echo "============================================================"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Missing $SOURCE"
            exit 1
          fi

          rm -rf "$RES"/mipmap-*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            mkdir -p "$RES/mipmap-$density"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo "Launcher icon installed."


      # ============================================================
      # 7. Remove adaptive icons
      # ============================================================

      - name: Remove adaptive icons
        script: |
          set -e

          RES="android/app/src/main/res"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            -delete || true

          find "$RES" \
            -type d \
            \( \
              -name "mipmap-anydpi" \
              -o -name "mipmap-anydpi-v26" \
              -o -name "mipmap-anydpi-v27" \
              -o -name "drawable-anydpi-v24" \
            \) \
            -exec rm -rf {} + || true

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true


      # ============================================================
      # 8. Android Manifest
      # ============================================================

      - name: Configure Android Manifest
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              """<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round" """,
              1
          )

          path.write_text(text)

          print("AndroidManifest configured.")
          PY


      # ============================================================
      # 9. Create release keystore
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          echo "============================================================"
          echo "CREATING RELEASE KEYSTORE"
          echo "============================================================"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Generated keystore is empty."
            exit 1
          fi

          echo "Keystore created successfully."


      # ============================================================
      # 10. key.properties
      # ============================================================

      - name: Create key properties
        script: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # 11. Configure signing
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if "import java.util.Properties" not in text:

              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          if "val keystorePropertiesFile" not in text:

              loader = """
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          if 'create("release")' not in text:

              signing = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          """

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          text = text.replace(
              "signingConfig = signingConfigs.debug",
              'signingConfig = signingConfigs.getByName("release")'
          )

          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("release")""",
                  1
              )

          path.write_text(text)

          print("Release signing configured.")
          PY


      # ============================================================
      # 12. Java 17 / Kotlin JVM target
      # ============================================================

      - name: Configure Java 17
        script: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)

          print("Java 17 configured.")
          PY


      # ============================================================
      # 13. Unity Ads compatibility
      # ============================================================

      - name: Configure Unity Ads compatibility
        script: |
          set -e

          echo "============================================================"
          echo "CHECKING UNITY ADS"
          echo "============================================================"

          UNITY_PATH=""

          while IFS= read -r path
          do
            UNITY_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PATH" ]; then

            echo "Unity Ads found:"
            echo "$UNITY_PATH"

            find "$UNITY_PATH/android" \
              -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print0 2>/dev/null |
            while IFS= read -r -d '' FILE
            do

              sed -i \
                -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                "$FILE" || true

              sed -i \
                -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                "$FILE" || true

            done

          else

            echo "Unity Ads plugin not found in cache."

          fi


      # ============================================================
      # 14. Flutter clean
      # ============================================================

      - name: Flutter clean
        script: |
          set -e

          flutter clean


      # ============================================================
      # 15. Pub get
      # ============================================================

      - name: Flutter pub get final
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 16. Download Gradle 8.14 with retries
      # ============================================================

      - name: Prepare Gradle 8.14
        script: |
          set -e

          echo "============================================================"
          echo "PREPARING GRADLE 8.14"
          echo "============================================================"

          GRADLE_VERSION="8.14"
          GRADLE_HOME="$HOME/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$HOME/gradle-$GRADLE_VERSION-bin.zip"

          if [ -x "$GRADLE_HOME/bin/gradle" ]; then

            echo "Gradle 8.14 already exists."

          else

            echo "Downloading Gradle 8.14..."

            rm -f "$GRADLE_ZIP"

            curl \
              --fail \
              --location \
              --retry 10 \
              --retry-delay 5 \
              --retry-max-time 300 \
              --connect-timeout 30 \
              --max-time 900 \
              -o "$GRADLE_ZIP" \
              "https://services.gradle.org/distributions/gradle-8.14-bin.zip"

            echo "Gradle downloaded."

            rm -rf "$GRADLE_HOME"

            unzip -q \
              "$GRADLE_ZIP" \
              -d "$HOME"

          fi

          "$GRADLE_HOME/bin/gradle" --version


      # ============================================================
      # 17. Put Gradle 8.14 in wrapper cache
      # ============================================================

      - name: Prepare Gradle wrapper cache
        script: |
          set -e

          GRADLE_VERSION="8.14"
          GRADLE_HOME="$HOME/gradle-$GRADLE_VERSION"

          echo "Gradle installation:"
          "$GRADLE_HOME/bin/gradle" --version

          echo ""
          echo "Wrapper configuration:"
          cat android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 18. Final verification
      # ============================================================

      - name: Final Android verification
        script: |
          set -e

          echo "============================================================"
          echo "FINAL ANDROID VERIFICATION"
          echo "============================================================"

          echo ""
          echo "Gradle wrapper:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Android plugins:"
          grep -n \
            -E "com.android.application|org.jetbrains.kotlin.android" \
            android/settings.gradle.kts || true

          echo ""
          echo "Keystore:"
          ls -lh android/app/upload-keystore.jks

          echo ""
          echo "Key properties:"
          ls -lh android/key.properties

          echo ""
          echo "Launcher icons:"
          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \) \
            | sort


      # ============================================================
      # 19. Build release APK
      # ============================================================

      - name: Build release APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          export GRADLE_USER_HOME="$HOME/.gradle"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"


    # ================================================================
    # ARTIFACT
    # ================================================================

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk


    # ================================================================
    # EMAIL
    # ================================================================

    publishing:
      email:
        recipients:
          - ebrahassadi@gmail.com
        notify:
          success: true
          failure: true