workflows:

  android-workflow:

    name: Puzzle World Android Release


    environment:

      flutter: stable


    scripts:


      - name: Check environment
        script: |
          flutter --version
          flutter doctor -v
          java -version


      - name: Clean project
        script: |
          flutter clean


      - name: Get packages
        script: |
          flutter pub get


      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons


      - name: Generate native splash
        script: |
          dart run flutter_native_splash:create


      - name: Build APK
        script: |
          flutter build apk --release --split-per-abi -v


      - name: Debug APK output
        script: |
          echo "===== Checking APK files ====="
          find . -name "*.apk" -print

          echo "===== Checking Flutter APK folder ====="
          ls -la build/app/outputs/flutter-apk || true

          echo "===== Checking Android APK folder ====="
          ls -la android/app/build/outputs/apk/release || true



    artifacts:

      - build/app/outputs/flutter-apk/*.apk

      - android/app/build/outputs/apk/release/*.apk