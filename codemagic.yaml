workflows:

  android-workflow:

    name: Puzzle World Android Release


    environment:

      flutter: stable


    scripts:


      - name: Clean project
        script: |
          flutter clean


      - name: Get packages
        script: |
          flutter pub get


      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons


      - name: Generate native splash
        script: |
          dart run flutter_native_splash:create


      - name: Build APK
        script: |
          flutter build apk --release -v


      - name: Debug APK output
        script: |
          echo "===== Checking APK files ====="
          find . -name "*.apk" -print

          echo "===== Checking build folders ====="
          ls -la build || true
          ls -la build/app || true
          ls -la build/app/outputs || true
          ls -la build/app/outputs/flutter-apk || true
          ls -la android/app/build/outputs/apk/release || true


    artifacts:

      - build/app/outputs/flutter-apk/*.apk

      - android/app/build/outputs/apk/release/*.apk