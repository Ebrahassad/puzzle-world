workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: 3.44.8
      java: 17

      vars:
        PACKAGE_NAME: "com.ebrahassadi.puzzle_world"

        # Unity Ads
        # ضع قيم Unity الخاصة بك في Codemagic Environment Variables
        UNITY_GAME_ID_ANDROID: $UNITY_GAME_ID_ANDROID

        # Signing
        KEYSTORE_BASE64: $KEYSTORE_BASE64
        KEYSTORE_PASSWORD: $KEYSTORE_PASSWORD
        KEY_ALIAS: $KEY_ALIAS
        KEY_PASSWORD: $KEY_PASSWORD

    scripts:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Check Flutter
        script: |
          set -e

          echo "============================================================"
          echo "FLUTTER VERSION"
          echo "============================================================"

          flutter --version

      # ============================================================
      # 2. CREATE ANDROID IF MISSING
      # ============================================================

      - name: Create Android project if missing
        script: |
          set -e

          echo "============================================================"
          echo "ANDROID PROJECT"
          echo "============================================================"

          if [ -f "android/settings.gradle.kts" ] || [ -f "android/settings.gradle" ]; then
            echo "Android project already exists."
          else
            echo "Android project does not exist."
            echo "Creating Android project from scratch..."

            flutter create \
              --platforms=android \
              --org com.ebrahassadi \
              --project-name puzzle_world \
              .

            echo "Android project created."
          fi

      # ============================================================
      # 3. FORCE COMPATIBLE GRADLE + AGP + KOTLIN
      # ============================================================

      - name: Configure Android build tools
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING ANDROID BUILD TOOLS"
          echo "============================================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          # --------------------------------------------------------
          # Gradle wrapper
          # --------------------------------------------------------

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not wrapper.exists():
              raise SystemExit(
                  "ERROR: gradle-wrapper.properties not found."
              )

          text = wrapper.read_text()

          text = re.sub(
              r"distributionUrl=.*",
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip",
              text
          )

          wrapper.write_text(text)

          print("Gradle wrapper configured: 8.14")

          # --------------------------------------------------------
          # settings.gradle.kts
          # --------------------------------------------------------

          settings = Path("android/settings.gradle.kts")

          if settings.exists():
              text = settings.read_text()

              # AGP
              text = re.sub(
                  r'id\("com\.android\.application"\)\s+version\s+"[^"]+"',
                  'id("com.android.application") version "8.11.1"',
                  text
              )

              # Kotlin
              text = re.sub(
                  r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
                  'id("org.jetbrains.kotlin.android") version "2.2.20"',
                  text
              )

              # Handle single quote variants if any
              text = re.sub(
                  r'id\(\'com\.android\.application\'\)\s+version\s+\'[^\']+\'',
                  'id("com.android.application") version "8.11.1"',
                  text
              )

              text = re.sub(
                  r'id\(\'org\.jetbrains\.kotlin\.android\'\)\s+version\s+\'[^\']+\'',
                  'id("org.jetbrains.kotlin.android") version "2.2.20"',
                  text
              )

              settings.write_text(text)

              print("settings.gradle.kts configured.")

          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          settings_groovy = Path("android/settings.gradle")

          if settings_groovy.exists():
              text = settings_groovy.read_text()

              text = re.sub(
                  r"id\s+['\"]com\.android\.application['\"]\s+version\s+['\"][^'\"]+['\"]",
                  "id 'com.android.application' version '8.11.1'",
                  text
              )

              text = re.sub(
                  r"id\s+['\"]org\.jetbrains\.kotlin\.android['\"]\s+version\s+['\"][^'\"]+['\"]",
                  "id 'org.jetbrains.kotlin.android' version '2.2.20'",
                  text
              )

              settings_groovy.write_text(text)

              print("settings.gradle configured.")

          PY

          echo ""
          echo "Gradle version:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Android settings:"
          if [ -f android/settings.gradle.kts ]; then
            grep -E \
              'com.android.application|org.jetbrains.kotlin.android' \
              android/settings.gradle.kts || true
          fi

      # ============================================================
      # 4. PUB GET
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e
          flutter pub get

      # ============================================================
      # 5. CREATE NORMAL PNG ICON
      # ============================================================

      - name: Install Puzzle World launcher icon
        script: |
          set -e

          echo "============================================================"
          echo "INSTALLING LAUNCHER ICON"
          echo "============================================================"

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR:"
            echo "$ICON"
            echo "does not exist."
            exit 1
          fi

          echo "Icon found."

          # Delete generated launcher resources
          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          # Create normal mipmap folders
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            mkdir -p "$RES/mipmap-$density"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo ""
          echo "Launcher icon installed."
          echo "Original PNG was copied without processing."

      # ============================================================
      # 6. MANIFEST ICON
      # ============================================================

      - name: Configure Android Manifest
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              text
          )

          text = re.sub(
              r'android:roundIcon="[^"]*"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              text
          )

          if 'android:icon="@mipmap/ic_launcher"' not in text:
              text = text.replace(
                  "<application",
                  '<application\n'
                  '        android:icon="@mipmap/ic_launcher"',
                  1
              )

          if 'android:roundIcon="@mipmap/ic_launcher_round"' not in text:
              text = text.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@mipmap/ic_launcher"\n'
                  '        android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          manifest.write_text(text)

          print("AndroidManifest.xml configured.")

          PY

          grep -n \
            -E 'android:icon|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml || true

      # ============================================================
      # 7. CREATE KEYSTORE
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          echo "============================================================"
          echo "CREATING RELEASE KEYSTORE"
          echo "============================================================"

          mkdir -p android/app

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore creation failed."
            exit 1
          fi

          echo "Keystore created successfully."

      # ============================================================
      # 8. KEY PROPERTIES
      # ============================================================

      - name: Create key.properties
        script: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."

      # ============================================================
      # 9. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found."
              )

          text = path.read_text()

          # Remove our previous injection if it exists
          marker_start = "// PUZZLE_WORLD_SIGNING_START"
          marker_end = "// PUZZLE_WORLD_SIGNING_END"

          if marker_start in text and marker_end in text:
              start = text.index(marker_start)
              end = text.index(marker_end) + len(marker_end)

              text = text[:start] + text[end:]

          imports = (
              "import java.util.Properties\n"
              "import java.io.FileInputStream\n\n"
          )

          if "import java.util.Properties" not in text:
              text = imports + text

          signing_loader = """
          // PUZZLE_WORLD_SIGNING_START
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }
          // PUZZLE_WORLD_SIGNING_END

          """

          android_index = text.find("android {")

          if android_index == -1:
              raise SystemExit(
                  "ERROR: android block not found."
              )

          text = (
              text[:android_index]
              + signing_loader
              + text[android_index:]
          )

          signing_block = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]
                              ?.toString()
                              ?.let { rootProject.file(it) }
                  }
              }

          """

          android_index = text.find("android {")

          insert_position = android_index + len("android {")

          text = (
              text[:insert_position]
              + signing_block
              + text[insert_position:]
          )

          # Release signing
          if 'signingConfig = signingConfigs.getByName("release")' not in text:

              release_marker = 'buildTypes {'

              build_types_index = text.find(release_marker)

              if build_types_index == -1:
                  raise SystemExit(
                      "ERROR: buildTypes block not found."
                  )

              release_index = text.find(
                  'release {',
                  build_types_index
              )

              if release_index == -1:
                  raise SystemExit(
                      "ERROR: release buildType not found."
                  )

              release_insert = release_index + len(
                  'release {'
              )

              text = (
                  text[:release_insert]
                  + '\n'
                  + '            signingConfig = '
                  + 'signingConfigs.getByName("release")'
                  + '\n'
                  + text[release_insert:]
              )

          # Java 17
          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)

          print("Release signing configured successfully.")

          PY

      # ============================================================
      # 10. UNITY ADS JVM FIX
      # ============================================================

      - name: Configure Unity Ads
        script: |
          set -e

          echo "============================================================"
          echo "UNITY ADS"
          echo "============================================================"

          find "$HOME/.pub-cache" \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -path "*unity_ads_plugin-*" \
            -print0 2>/dev/null |
          while IFS= read -r -d '' file; do

            echo "Checking:"
            echo "$file"

            python3 - "$file" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'JavaVersion.VERSION_1_8',
              'JavaVersion.VERSION_17'
          )

          text = text.replace(
              'JavaVersion.VERSION_11',
              'JavaVersion.VERSION_17'
          )

          path.write_text(text)
          PY

          done

          echo "Unity Ads JVM configuration completed."

      # ============================================================
      # 11. VERIFY GRADLE
      # ============================================================

      - name: Verify Android configuration
        script: |
          set -e

          echo "============================================================"
          echo "FINAL ANDROID CONFIGURATION"
          echo "============================================================"

          echo ""
          echo "Gradle:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Application ID:"
          grep -R \
            'applicationId' \
            android/app/build.gradle.kts || true

          echo ""
          echo "Launcher icons:"
          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \) \
            | sort

          echo ""
          echo "Adaptive icons:"
          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) || true

      # ============================================================
      # 12. CLEAN
      # ============================================================

      - name: Flutter clean
        script: |
          set -e
          flutter clean

      # ============================================================
      # 13. PUB GET
      # ============================================================

      - name: Flutter pub get final
        script: |
          set -e
          flutter pub get

      # ============================================================
      # 14. BUILD APK
      # ============================================================

      - name: Build signed release APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk \
            --release

          echo ""
          echo "BUILD SUCCESSFUL."

      # ============================================================
      # 15. VERIFY APK
      # ============================================================

      - name: Verify APK
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      scripts:
        - name: Build completed
          script: |
            echo "============================================================"
            echo "PUZZLE WORLD RELEASE BUILD COMPLETED"
            echo "============================================================"
            ls -lh build/app/outputs/flutter-apk/app-release.apk