workflows:
  android-workflow:
    name: Puzzle World Android Release

    environment:
      flutter: stable

    scripts:

      - name: Clean
        script: |
          flutter clean
          rm -f pubspec.lock

      - name: Get packages
        script: |
          flutter pub get

      - name: Check ads version
        script: |
          flutter pub deps | grep google_mobile_ads

      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk