workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: push

    environment:
      flutter: 3.44.8
      groups:
        - android_signing

    scripts:

      - name: Flutter version
        script: |
          flutter --version
          flutter doctor -v

      - name: Create Android project
        script: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android folder not found."
            echo "Creating Android project from scratch..."

            flutter create \
              --platforms=android \
              --org com.ebrahassadi \
              --project-name puzzle_world \
              .

          else
            echo "Android folder already exists."
          fi

      - name: Flutter pub get
        script: |
          set -e
          flutter pub get

      - name: Verify application ID
        script: |
          set -e

          echo "Checking Android application ID..."

          grep -R "com.ebrahassad" android/app/build.gradle.kts || true
          grep -R "com.ebrahassad" android/app/build.gradle || true

      - name: Install launcher icon
        script: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: $SOURCE does not exist."
            exit 1
          fi

          echo "Installing Puzzle World launcher icon..."

          rm -rf "$RES"/mipmap-*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            mkdir -p "$RES/mipmap-$density"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "Launcher icon installed."

      - name: Remove adaptive icons
        script: |
          set -e

          RES="android/app/src/main/res"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            -delete || true

          find "$RES" \
            -type d \
            \( \
              -name "mipmap-anydpi" \
              -o -name "mipmap-anydpi-v26" \
              -o -name "mipmap-anydpi-v27" \
            \) \
            -exec rm -rf {} + || true

          echo "Adaptive icon resources removed."

      - name: Configure Android launcher icon
        script: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              '<application',
              '<application\n'
              '        android:icon="@mipmap/ic_launcher"\n'
              '        android:roundIcon="@mipmap/ic_launcher_round"',
              1
          )

          path.write_text(text)

          print("Launcher icon configured.")
          PY

      - name: Create release keystore
        script: |
          set -e

          echo "Creating release keystore..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Keystore created successfully."

      - name: Create key properties
        script: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."

      - name: Configure release signing
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          loader = '''
          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''

          if 'val keystorePropertiesFile' not in text:
              text = text.replace(
                  'android {',
                  loader + 'android {',
                  1
              )

          signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storePassword = keystoreProperties["storePassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let {
                          rootProject.file(it as String)
                      }
                  }
              }

          '''

          if 'create("release")' not in text:
              text = text.replace(
                  'android {',
                  'android {\n' + signing,
                  1
              )

          text = text.replace(
              'signingConfig = signingConfigs.debug',
              'signingConfig = signingConfigs.getByName("release")'
          )

          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):
              text = text.replace(
                  'release {',
                  'release {\n            signingConfig = signingConfigs.getByName("release")',
                  1
              )

          path.write_text(text)

          print("Release signing configured.")
          PY

      - name: Configure Java 17
        script: |
          set -e

          FILE="android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)
          PY

          echo "Java/Kotlin target configured for Java 17."

      - name: Verify Android project
        script: |
          set -e

          echo "============================================================"
          echo "ANDROID PROJECT"
          echo "============================================================"

          echo ""
          echo "Gradle:"
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Application Gradle:"
          cat android/app/build.gradle.kts

          echo ""
          echo "Manifest:"
          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "Launcher icons:"
          find android/app/src/main/res \
            -name "ic_launcher.png" \
            -o -name "ic_launcher_round.png"

      - name: Flutter clean
        script: |
          flutter clean

      - name: Flutter pub get final
        script: |
          flutter pub get

      - name: Build release APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "BUILD SUCCESSFUL."

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - ebrahassadi@gmail.com
        notify:
          success: true
          failure: true