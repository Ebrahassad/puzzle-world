workflows:
  android-workflow:
    name: Puzzle World Android Release

    environment:
      flutter: stable

    scripts:

      - name: Get packages
        script: |
          flutter pub get

      - name: Recreate Android
        script: |
          flutter create .

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk