workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push
        - tag
        - pull_request

      branch_patterns:
        - pattern: main
          include: true

    environment:
      flutter: 3.44.8

      groups:
        - android_signing

    scripts:

      # ============================================================
      # 1. CHECK FLUTTER
      # ============================================================

      - name: Flutter version
        script: |
          set -e

          echo "============================================================"
          echo "FLUTTER"
          echo "============================================================"

          flutter --version
          flutter doctor -v


      # ============================================================
      # 2. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        script: |
          set -e

          echo "============================================================"
          echo "CREATING ANDROID PROJECT"
          echo "============================================================"

          if [ ! -d "android" ]; then

            echo "Android folder does not exist."
            echo "Creating Android project from scratch..."

            flutter create \
              --platforms=android \
              --org com.ebrahassadi \
              --project-name puzzle_world \
              .

          else

            echo "Android folder already exists."

          fi


      # ============================================================
      # 3. CONFIGURE GRADLE 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING GRADLE 8.14"
          echo "============================================================"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          text = path.read_text()

          lines = []

          for line in text.splitlines():

              if line.startswith("distributionUrl="):

                  lines.append(
                      "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip"
                  )

              else:

                  lines.append(line)

          path.write_text(
              "\n".join(lines) + "\n"
          )

          print("Gradle 8.14 configured.")
          PY

          echo ""
          grep "distributionUrl" "$WRAPPER"


      # ============================================================
      # 4. CONFIGURE AGP 8.9.1 + KOTLIN 2.0.21
      # ============================================================

      - name: Configure AGP and Kotlin
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING AGP 8.9.1 / KOTLIN 2.0.21"
          echo "============================================================"

          FILE="android/settings.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")

          text = path.read_text()

          # Android Gradle Plugin
          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.9.1\g<2>',
              text
          )

          text = re.sub(
              r'(id\("com\.android\.library"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.9.1\g<2>',
              text
          )

          # Kotlin
          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              r'\g<1>2.0.21\g<2>',
              text
          )

          path.write_text(text)

          print("AGP 8.9.1 configured.")
          print("Kotlin 2.0.21 configured.")
          PY

          echo ""
          echo "Android plugins:"
          grep -n \
            -E "com.android.application|com.android.library|org.jetbrains.kotlin.android" \
            "$FILE" || true


      # ============================================================
      # 5. FLUTTER PUB GET
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 6. INSTALL APP ICON
      # ============================================================

      - name: Install Puzzle World launcher icon
        script: |
          set -e

          echo "============================================================"
          echo "INSTALLING PUZZLE WORLD ICON"
          echo "============================================================"

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Icon not found:"
            echo "$SOURCE"
            exit 1
          fi

          echo "Icon found."

          # Remove generated launcher resources
          rm -rf "$RES"/mipmap-*

          # Create classic PNG mipmap folders
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            mkdir -p "$RES/mipmap-$density"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$SOURCE" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo "Launcher PNG icons installed."


      # ============================================================
      # 7. REMOVE ADAPTIVE ICONS
      # ============================================================

      - name: Remove adaptive icons
        script: |
          set -e

          echo "============================================================"
          echo "REMOVING ADAPTIVE ICONS"
          echo "============================================================"

          RES="android/app/src/main/res"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            -delete || true

          find "$RES" \
            -type d \
            \( \
              -name "mipmap-anydpi" \
              -o -name "mipmap-anydpi-v26" \
              -o -name "mipmap-anydpi-v27" \
              -o -name "drawable-anydpi-v24" \
            \) \
            -exec rm -rf {} + || true

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          echo "Adaptive icons removed."


      # ============================================================
      # 8. CONFIGURE ANDROID MANIFEST
      # ============================================================

      - name: Configure Android Manifest
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING ANDROID MANIFEST"
          echo "============================================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          # Remove old icon attributes
          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          # Add normal PNG launcher references
          text = text.replace(
              "<application",
              """<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round" """,
              1
          )

          path.write_text(text)

          print("Manifest configured.")
          PY

          grep -n \
            -E "android:icon|android:roundIcon" \
            android/app/src/main/AndroidManifest.xml


      # ============================================================
      # 9. CREATE RELEASE KEYSTORE
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          echo "============================================================"
          echo "CREATING RELEASE KEYSTORE"
          echo "============================================================"

          if [ -z "$KEYSTORE_BASE64" ]; then

            echo "ERROR:"
            echo "KEYSTORE_BASE64 is empty."

            exit 1

          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then

            echo "ERROR:"
            echo "Keystore file is empty."

            exit 1

          fi

          echo "Keystore created successfully."

          ls -lh android/app/upload-keystore.jks


      # ============================================================
      # 10. CREATE KEY PROPERTIES
      # ============================================================

      - name: Create key properties
        script: |
          set -e

          echo "============================================================"
          echo "CREATING KEY.PROPERTIES"
          echo "============================================================"

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."

          echo ""
          echo "Signing alias:"
          echo "$KEY_ALIAS"


      # ============================================================
      # 11. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING RELEASE SIGNING"
          echo "============================================================"

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then

            echo "ERROR:"
            echo "$FILE not found."

            exit 1

          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/build.gradle.kts"
          )

          text = path.read_text()

          # --------------------------------------------------------
          # Imports
          # --------------------------------------------------------

          if "import java.util.Properties" not in text:

              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          # --------------------------------------------------------
          # Keystore loader
          # --------------------------------------------------------

          if "val keystorePropertiesFile" not in text:

              loader = """
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          # --------------------------------------------------------
          # Signing config
          # --------------------------------------------------------

          if 'create("release")' not in text:

              signing = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          """

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          # --------------------------------------------------------
          # Release signing
          # --------------------------------------------------------

          text = text.replace(
              "signingConfig = signingConfigs.debug",
              'signingConfig = signingConfigs.getByName("release")'
          )

          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("release")""",
                  1
              )

          path.write_text(text)

          print("Release signing configured.")
          PY


      # ============================================================
      # 12. JAVA 17 / KOTLIN JVM
      # ============================================================

      - name: Configure Java 17
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING JAVA 17"
          echo "============================================================"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/build.gradle.kts"
          )

          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)

          print("Java 17 configured.")
          PY


      # ============================================================
      # 13. UNITY ADS JVM COMPATIBILITY
      # ============================================================

      - name: Configure Unity Ads compatibility
        script: |
          set -e

          echo "============================================================"
          echo "CHECKING UNITY ADS"
          echo "============================================================"

          UNITY_PATH=""

          while IFS= read -r path
          do

            UNITY_PATH="$path"
            break

          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PATH" ]; then

            echo "Unity Ads plugin found:"
            echo "$UNITY_PATH"

            if [ -d "$UNITY_PATH/android" ]; then

              find "$UNITY_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 2>/dev/null |
              while IFS= read -r -d '' FILE
              do

                echo "Checking:"
                echo "$FILE"

                sed -i \
                  -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$FILE" || true

                sed -i \
                  -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                  "$FILE" || true

              done

            fi

          else

            echo "Unity Ads plugin not found in cache."

          fi


      # ============================================================
      # 14. FLUTTER CLEAN
      # ============================================================

      - name: Flutter clean
        script: |
          set -e

          flutter clean


      # ============================================================
      # 15. FLUTTER PUB GET FINAL
      # ============================================================

      - name: Flutter pub get final
        script: |
          set -e

          flutter pub get


      # ============================================================
      # 16. VERIFY GRADLE / AGP / KOTLIN
      # ============================================================

      - name: Verify Android build configuration
        script: |
          set -e

          echo "============================================================"
          echo "ANDROID BUILD CONFIGURATION"
          echo "============================================================"

          echo ""
          echo "Gradle:"
          grep \
            "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Android plugins:"
          grep -n \
            -E "com.android.application|org.jetbrains.kotlin.android" \
            android/settings.gradle.kts || true

          echo ""
          echo "Keystore:"
          ls -lh android/app/upload-keystore.jks

          echo ""
          echo "Launcher icons:"
          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \) \
            | sort


      # ============================================================
      # 17. BUILD RELEASE APK
      # ============================================================

      - name: Build release APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"


    # ================================================================
    # ARTIFACT
    # ================================================================

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk


    # ================================================================
    # EMAIL
    # ================================================================

    publishing:
      email:
        recipients:
          - ebrahassadi@gmail.com

        notify:
          success: true
          failure: true