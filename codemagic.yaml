workflows:
  android-release:
    name: Puzzle World Android Release

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: 3.44.8
      java: 17

      groups:
        - android_signing

      vars:
        PACKAGE_NAME: "com.ebrahassad.puzzle_world"

    scripts:

      # ============================================================
      # 1. CREATE ANDROID PROJECT
      # ============================================================

      - name: Generate Android project
        script: |
          set -e

          echo "============================================================"
          echo "GENERATING ANDROID PROJECT"
          echo "============================================================"

          if [ ! -d "android" ]; then

            flutter create \
              --platforms=android \
              --org com.ebrahassad \
              --project-name puzzle_world \
              .

            echo "Android project created successfully."

          else

            echo "Android folder already exists."

          fi

      # ============================================================
      # 2. FLUTTER PUB GET
      # ============================================================

      - name: Flutter pub get
        script: |
          set -e

          flutter pub get

      # ============================================================
      # 3. CONFIGURE GRADLE 8.14 + AGP 8.11.1 + KOTLIN
      # ============================================================

      - name: Configure Android build tools
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING ANDROID BUILD TOOLS"
          echo "============================================================"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          # --------------------------------------------------------
          # Gradle 8.14
          # --------------------------------------------------------

          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip#' \
            "$WRAPPER"

          echo ""
          echo "Gradle wrapper:"
          grep "distributionUrl" "$WRAPPER"

          # --------------------------------------------------------
          # AGP + Kotlin
          # --------------------------------------------------------

          if [ -f "android/settings.gradle.kts" ]; then

            echo ""
            echo "Using settings.gradle.kts"

            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' \
              android/settings.gradle.kts

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' \
              android/settings.gradle.kts

          elif [ -f "android/settings.gradle" ]; then

            echo ""
            echo "Using settings.gradle"

            sed -i \
              "s/id 'com.android.application' version '[^']*'/id 'com.android.application' version '8.11.1'/" \
              android/settings.gradle

            sed -i \
              "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '2.2.20'/" \
              android/settings.gradle

          fi

          echo ""
          echo "Android plugins after configuration:"

          grep -R \
            -E 'com.android.application|org.jetbrains.kotlin.android' \
            android/settings.gradle* \
            2>/dev/null || true

          echo ""
          echo "Android build tools configured."

      # ============================================================
      # 4. JAVA / KOTLIN 17
      # ============================================================

      - name: Configure Java and Kotlin 17
        script: |
          set -e

          echo "============================================================"
          echo "CONFIGURING JAVA / KOTLIN 17"
          echo "============================================================"

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          sed -i \
            's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            "$FILE"

          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$FILE"

          sed -i \
            's/jvmTarget = "1.8"/jvmTarget = "17"/g' \
            "$FILE"

          sed -i \
            's/jvmTarget = "11"/jvmTarget = "17"/g' \
            "$FILE"

          echo "Java/Kotlin target configured."

      # ============================================================
      # 5. INSTALL ORIGINAL APP ICON
      # ============================================================

      - name: Install Puzzle World launcher icon
        script: |
          set -e

          echo "============================================================"
          echo "INSTALLING PUZZLE WORLD ICON"
          echo "============================================================"

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Icon not found:"
            echo "$ICON"
            exit 1
          fi

          echo "Icon found:"
          echo "$ICON"

          # Remove generated mipmap resources
          rm -rf "$RES"/mipmap-*

          # Create normal Android mipmap folders
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            mkdir -p "$RES/mipmap-$density"

            # Copy PNG EXACTLY AS IT IS
            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo ""
          echo "Original icon copied without resizing."
          echo "No processing."
          echo "No adaptive icon."
          echo "No foreground."
          echo "No background."

      # ============================================================
      # 6. REMOVE ADAPTIVE ICONS
      # ============================================================

      - name: Remove adaptive launcher icons
        script: |
          set -e

          RES="android/app/src/main/res"

          echo "Removing adaptive launcher resources..."

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete

          echo "Adaptive icons removed."

      # ============================================================
      # 7. CONFIGURE ANDROID MANIFEST
      # ============================================================

      - name: Configure launcher manifest
        script: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "Configuring AndroidManifest.xml..."

          sed -i \
            's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' \
            "$MANIFEST"

          if grep -q "android:roundIcon=" "$MANIFEST"; then

            sed -i \
              's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' \
              "$MANIFEST"

          else

            sed -i \
              's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"#' \
              "$MANIFEST"

          fi

          echo ""
          echo "Manifest icon configuration:"

          grep -n \
            -E 'android:icon|android:roundIcon' \
            "$MANIFEST" || true

      # ============================================================
      # 8. VERIFY ICON
      # ============================================================

      - name: Verify launcher icon
        script: |
          set -e

          RES="android/app/src/main/res"

          echo "============================================================"
          echo "VERIFYING LAUNCHER ICON"
          echo "============================================================"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            if [ ! -f "$RES/mipmap-$density/ic_launcher.png" ]; then
              echo "ERROR: Missing icon in mipmap-$density"
              exit 1
            fi

            if [ ! -f "$RES/mipmap-$density/ic_launcher_round.png" ]; then
              echo "ERROR: Missing round icon in mipmap-$density"
              exit 1
            fi

          done

          if find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            | grep -q .; then

            echo "ERROR: Adaptive icon XML exists."
            exit 1

          fi

          echo ""
          echo "Icon verification successful."

      # ============================================================
      # 9. CREATE RELEASE KEYSTORE
      # ============================================================

      - name: Create release keystore
        script: |
          set -e

          echo "============================================================"
          echo "CREATING RELEASE KEYSTORE"
          echo "============================================================"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore created successfully."

      # ============================================================
      # 10. CREATE KEY.PROPERTIES
      # ============================================================

      - name: Create signing properties
        script: |
          set -e

          echo "Creating android/key.properties..."

          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."

      # ============================================================
      # 11. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found."
              )

          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Imports
          # --------------------------------------------------------

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          # --------------------------------------------------------
          # Keystore loader
          # --------------------------------------------------------

          loader = """
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          """

          if "val keystorePropertiesFile" not in text:
              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          # --------------------------------------------------------
          # Signing configuration
          # --------------------------------------------------------

          signing = """
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }

                      storePassword =
                          keystoreProperties["storePassword"] as String?
                  }
              }

          """

          if 'create("release")' not in text:
              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          # --------------------------------------------------------
          # Release build type
          # --------------------------------------------------------

          if (
              'signingConfig = signingConfigs.getByName("release")'
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig =
                          signingConfigs.getByName("release")""",
                  1
              )

          path.write_text(text, encoding="utf-8")

          print("Release signing configured successfully.")
          PY

      # ============================================================
      # 12. UNITY ADS
      # ============================================================

      - name: Verify Unity Ads plugin
        script: |
          set -e

          echo "============================================================"
          echo "CHECKING UNITY ADS"
          echo "============================================================"

          find "$HOME/.pub-cache" \
            -type d \
            -path "*unity_ads_plugin*" \
            -print \
            2>/dev/null || true

          echo "Unity Ads check completed."

      # ============================================================
      # 13. FLUTTER CLEAN
      # ============================================================

      - name: Flutter clean
        script: |
          set -e

          flutter clean

          flutter pub get

      # ============================================================
      # 14. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle 8.14
        script: |
          set -e

          echo "============================================================"
          echo "VERIFYING GRADLE"
          echo "============================================================"

          cd android

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 15. BUILD RELEASE APK
      # ============================================================

      - name: Build Puzzle World release APK
        script: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"

      # ============================================================
      # 16. VERIFY APK
      # ============================================================

      - name: Verify generated APK
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "============================================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "============================================================"

          ls -lh "$APK"

    # ==============================================================
    # ARTIFACT
    # ==============================================================

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk