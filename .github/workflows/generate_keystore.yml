name: Generate Puzzle World Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # ☕ Setup Java
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 🔐 Generate Release Keystore
      # ============================================================
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore puzzle-world-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias puzzle_world \
            -storepass "PuzzleWorldStore2026" \
            -keypass "PuzzleWorldKey2026" \
            -dname "CN=Puzzle World, OU=Mobile, O=Puzzle World, L=Tripoli, ST=Tripoli, C=LY"

          echo "Keystore created successfully."

      # ============================================================
      # 🔄 Convert Keystore to Base64
      # ============================================================
      - name: Convert Keystore to Base64
        run: |
          base64 -w 0 puzzle-world-release.jks \
            > puzzle-world-release-base64.txt

          echo "Base64 file created successfully."

      # ============================================================
      # 📦 Upload files
      # ============================================================
      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-keystore
          path: |
            puzzle-world-release.jks
            puzzle-world-release-base64.txt
          retention-days: 7