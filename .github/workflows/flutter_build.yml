name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # Generate Android App Icon
      # ============================================================

      - name: Generate Android App Icon
        run: dart run flutter_launcher_icons


      # ============================================================
      # Decode Release Keystore
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Release keystore created successfully."


      # ============================================================
      # Create key.properties
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created successfully."


      # ============================================================
      # Fix Unity Ads JVM target
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin found:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -print0 |
              while IFS= read -r -d '' file; do

                echo "Checking:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else

            echo "Unity Ads plugin path not found."
            echo "Continuing..."

          fi


      # ============================================================
      # Flutter Clean
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # Flutter Pub Get Again
      # ============================================================

      - name: Flutter Pub Get Again
        run: flutter pub get


      # ============================================================
      # Generate App Icon Again
      #
      # flutter clean removed generated files,
      # so generate the launcher icon again.
      # ============================================================

      - name: Generate App Icon Again
        run: dart run flutter_launcher_icons


      # ============================================================
      # CHECK GENERATED LAUNCHER ICONS
      #
      # This does NOT modify anything.
      # It only shows us exactly what flutter_launcher_icons
      # generated inside android/app/src/main/res/
      # ============================================================

      - name: Check Generated Launcher Icons
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "GENERATED ANDROID RES FILES"
          echo "============================================================"

          find android/app/src/main/res \
            -maxdepth 3 \
            -type f \
            | sort

          echo ""
          echo "============================================================"
          echo "LAUNCHER ICON REFERENCES"
          echo "============================================================"

          grep -R "ic_launcher" \
            android/app/src/main/res \
            2>/dev/null || true

          echo ""
          echo "============================================================"
          echo "LAUNCHER ICON DIRECTORIES"
          echo "============================================================"

          find android/app/src/main/res \
            -maxdepth 2 \
            -type d \
            \( -name "mipmap*" -o -name "drawable*" \) \
            | sort || true

          echo ""
          echo "============================================================"
          echo "CHECK COMPLETE"
          echo "============================================================"


      # ============================================================
      # Build Release APK
      # ============================================================

      - name: Build Release APK
        run: flutter build apk --release


      # ============================================================
      # Upload Release APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error