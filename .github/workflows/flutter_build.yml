      - name: Inspect generated Android
        run: |
          echo "===== ANDROID ====="
          find android -maxdepth 3 -type f | sort

          echo "===== MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml

          echo "===== APP GRADLE ====="
          cat android/app/build.gradle.kts

          echo "===== SETTINGS ====="
          cat android/settings.gradle.kts