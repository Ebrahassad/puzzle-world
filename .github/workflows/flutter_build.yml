name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # Java 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # Flutter
      # ==========================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      # ==========================================================
      # Flutter dependencies
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get

      # ==========================================================
      # Create release signing configuration
      # ==========================================================

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/puzzle-world-release.jks

          if [ ! -s android/puzzle-world-release.jks ]; then
            echo "ERROR: Keystore file was not created correctly."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../puzzle-world-release.jks
          EOF

          echo "Release signing configuration created successfully."

      # ==========================================================
      # Verify signing configuration
      # ==========================================================

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          keytool -list \
            -keystore android/puzzle-world-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "${{ secrets.KEY_ALIAS }}"

          echo "Keystore verification successful."

      # ==========================================================
      # Clean
      # ==========================================================

      - name: Flutter clean
        run: flutter clean

      # ==========================================================
      # Build release APK
      # ==========================================================

      - name: Build release APK
        run: flutter build apk --release

      # ==========================================================
      # Upload APK
      # ==========================================================

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # Cleanup signing files
      # ==========================================================

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/puzzle-world-release.jks

          echo "Signing files cleaned up."