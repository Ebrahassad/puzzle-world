name: Build Puzzle World Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Puzzle World Release APK
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.ebrahassadi.puzzle_world
      VERSION_NAME: 1.0.2
      VERSION_CODE: 3

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. FLUTTER 3.44.8
      # ============================================================

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # 4. VERIFY TOOLS
      # ============================================================

      - name: Verify tools
        run: |
          set -e

          echo "Flutter:"
          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Java:"
          java -version


      # ============================================================
      # 5. RECREATE ANDROID PROJECT
      # ============================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "RECREATING ANDROID PROJECT"
          echo "============================================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.ebrahassadi \
            --project-name puzzle_world \
            .

          test -d android
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts

          echo "Android project created successfully."


      # ============================================================
      # 6. FORCE PACKAGE NAME
      # ============================================================

      - name: Configure exact Package Name
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" "$PACKAGE_NAME" "$VERSION_NAME" "$VERSION_CODE" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          package_name = sys.argv[2]
          version_name = sys.argv[3]
          version_code = sys.argv[4]

          text = path.read_text()

          # Remove any previous applicationId
          text = re.sub(
              r'applicationId\s*=\s*"[^"]*"',
              '',
              text
          )

          # Remove any previous namespace
          text = re.sub(
              r'namespace\s*=\s*"[^"]*"',
              '',
              text
          )

          # Remove any previous versionCode/versionName
          text = re.sub(
              r'versionCode\s*=\s*[^\n]+',
              '',
              text
          )

          text = re.sub(
              r'versionName\s*=\s*"[^"]*"',
              '',
              text
          )

          # Add namespace
          text = text.replace(
              'android {',
              f'''android {{
              namespace = "{package_name}"''',
              1
          )

          # Add exact applicationId and versions
          text = text.replace(
              'defaultConfig {',
              f'''defaultConfig {{
                  applicationId = "{package_name}"
                  versionCode = {version_code}
                  versionName = "{version_name}"''',
              1
          )

          path.write_text(text)
          PY

          echo ""
          echo "Configured Package Name:"
          grep -n "namespace" "$APP"
          grep -n "applicationId" "$APP"

          echo ""
          echo "Configured Version:"
          grep -n "versionCode" "$APP"
          grep -n "versionName" "$APP"


      # ============================================================
      # 7. FORCE PACKAGE NAME IN KOTLIN
      # ============================================================

      - name: Configure Android Kotlin package
        shell: bash
        run: |
          set -e

          find android/app/src/main/kotlin \
            -type f \
            -name "*.kt" \
            -print

          while IFS= read -r file
          do
            sed -i \
              -E 's/^package .*/package com.ebrahassadi.puzzle_world/' \
              "$file"
          done < <(
            find android/app/src/main/kotlin \
              -type f \
              -name "*.kt"
          )

          echo ""
          echo "Kotlin package verification:"

          grep -R \
            "^package " \
            android/app/src/main/kotlin \
            || true


      # ============================================================
      # 8. GRADLE 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        shell: bash
        run: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - "$WRAPPER" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip',
              text
          )

          path.write_text(text)
          PY

          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 9. AGP 8.11.1 + KOTLIN 2.2.20
      # ============================================================

      - name: Configure Android Gradle Plugin and Kotlin
        shell: bash
        run: |
          set -e

          SETTINGS="android/settings.gradle.kts"

          python3 - "$SETTINGS" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.11.1\g<2>',
              text
          )

          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              r'\g<1>2.2.20\g<2>',
              text
          )

          path.write_text(text)
          PY

          cat android/settings.gradle.kts


      # ============================================================
      # 10. JAVA 17 / KOTLIN JVM 17
      # ============================================================

      - name: Configure Java 17
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)
          PY


      # ============================================================
      # 11. FLUTTER PUB GET
      # ============================================================

      - name: Flutter pub get
        run: flutter pub get


      # ============================================================
      # 12. LAUNCHER ICON
      # ============================================================

      - name: Install normal PNG launcher icon
        shell: bash
        run: |
          set -e

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: $ICON does not exist."
            exit 1
          fi

          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            mkdir -p "$RES/mipmap-$density"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "Launcher icon installed."


      # ============================================================
      # 13. REMOVE ADAPTIVE ICONS
      # ============================================================

      - name: Remove adaptive icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true


      # ============================================================
      # 14. ANDROID MANIFEST
      # ============================================================

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              '''<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"''',
              1
          )

          path.write_text(text)
          PY

          grep -n \
            -E 'android:icon|android:roundIcon' \
            "$MANIFEST"


      # ============================================================
      # 15. RELEASE KEYSTORE
      # ============================================================

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Release keystore created."


      # ============================================================
      # 16. KEY PROPERTIES
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # 17. RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          if "val keystorePropertiesFile" not in text:

              loader = '''
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          '''

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          if 'create("release")' not in text:

              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          '''

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          # Make release use ONLY release signing.
          import re

          text = re.sub(
              r'release\s*\{[\s\S]*?\n\s*\}',
              lambda m: m.group(0),
              text,
              count=1
          )

          if 'signingConfig = signingConfigs.getByName("release")' not in text:

              text = text.replace(
                  "release {",
                  '''release {
                      signingConfig =
                          signingConfigs.getByName("release")''',
                  1
              )

          # Remove accidental debug signing.
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              ''
          )

          path.write_text(text)

          print("Release signing configured.")
          PY


      # ============================================================
      # 18. VERIFY CONFIGURATION BEFORE BUILD
      # ============================================================

      - name: Verify final Android configuration
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          echo "============================================================"
          echo "PACKAGE NAME CHECK"
          echo "============================================================"

          grep -n "namespace" "$APP"
          grep -n "applicationId" "$APP"

          echo ""
          echo "============================================================"
          echo "VERSION CHECK"
          echo "============================================================"

          grep -n "versionCode" "$APP"
          grep -n "versionName" "$APP"

          echo ""
          echo "============================================================"
          echo "SIGNING CHECK"
          echo "============================================================"

          grep -n "signingConfig" "$APP" || true

          echo ""
          echo "============================================================"
          echo "KEY PROPERTIES"
          echo "============================================================"

          grep -E \
            '^(storeFile|keyAlias)=' \
            android/key.properties

          echo ""
          echo "============================================================"
          echo "FORBIDDEN PACKAGE CHECK"
          echo "============================================================"

          if grep -R \
            -n \
            "com.ebrahassadi\.\*\*\*" \
            android \
            --exclude-dir=.gradle \
            --exclude="*.lock" \
            2>/dev/null
          then
            echo ""
            echo "ERROR: Invalid package name detected."
            exit 1
          fi

          echo "No invalid *** package detected."


      # ============================================================
      # 19. UNITY ADS JVM COMPATIBILITY
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path
          do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file
              do

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else
            echo "Unity Ads plugin not found."
          fi


      # ============================================================
      # 20. CLEAN
      # ============================================================

      - name: Flutter clean
        run: flutter clean


      # ============================================================
      # 21. PUB GET
      # ============================================================

      - name: Flutter pub get final
        run: flutter pub get


      # ============================================================
      # 22. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew --version


      # ============================================================
      # 23. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

          test -f \
            build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 24. PREPARE RELEASE FILES
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/PuzzleWorld-release.apk

          ls -lh release/PuzzleWorld-release.apk


      # ============================================================
      # 25. VERIFY APK PACKAGE / VERSION / SIGNATURE
      # ============================================================

      - name: Verify final APK
        shell: bash
        run: |
          set -e

          APK="release/PuzzleWorld-release.apk"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          BADGING=$(
            "$AAPT" dump badging "$APK"
          )

          PACKAGE=$(
            echo "$BADGING" |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )

          VERSION_NAME_ACTUAL=$(
            echo "$BADGING" |
            sed -n \
              "s/.*versionName='\([^']*\)'.*/\1/p" |
            head -1
          )

          VERSION_CODE_ACTUAL=$(
            echo "$BADGING" |
            sed -n \
              "s/.*versionCode='\([^']*\)'.*/\1/p" |
            head -1
          )

          echo "============================================================"
          echo "FINAL APK IDENTITY"
          echo "============================================================"

          echo "Package Name:"
          echo "$PACKAGE"

          echo ""
          echo "Version Name:"
          echo "$VERSION_NAME_ACTUAL"

          echo ""
          echo "Version Code:"
          echo "$VERSION_CODE_ACTUAL"

          echo ""
          echo "============================================================"
          echo "EXPECTED VALUES"
          echo "============================================================"

          echo "Expected Package:"
          echo "$PACKAGE_NAME"

          echo "Expected Version:"
          echo "$VERSION_NAME"

          echo "Expected Version Code:"
          echo "$VERSION_CODE"

          echo ""
          echo "============================================================"
          echo "VALIDATING"
          echo "============================================================"

          if [ "$PACKAGE" != "$PACKAGE_NAME" ]; then
            echo "ERROR: Package Name is incorrect."
            echo "Expected: $PACKAGE_NAME"
            echo "Actual:   $PACKAGE"
            exit 1
          fi

          if [ "$VERSION_NAME_ACTUAL" != "$VERSION_NAME" ]; then
            echo "ERROR: Version Name is incorrect."
            exit 1
          fi

          if [ "$VERSION_CODE_ACTUAL" != "$VERSION_CODE" ]; then
            echo "ERROR: Version Code is incorrect."
            exit 1
          fi

          echo "Package Name: OK"
          echo "Version Name: OK"
          echo "Version Code: OK"


          echo ""
          echo "============================================================"
          echo "APK SHA-256"
          echo "============================================================"

          SHA256=$(
            sha256sum "$APK" |
            awk '{print $1}'
          )

          echo "$SHA256"


          echo ""
          echo "============================================================"
          echo "APK SIGNATURE"
          echo "============================================================"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"


          echo ""
          echo "============================================================"
          echo "APK SIGNING CERTIFICATE"
          echo "============================================================"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK"


          echo ""
          echo "============================================================"
          echo "APK SIZE"
          echo "============================================================"

          ls -lh "$APK"


          # ========================================================
          # RELEASE INFO
          # ========================================================

          cat > release/PuzzleWorld-release-info.txt <<EOF
          Puzzle World
          ================================================

          Package Name:
          $PACKAGE

          Version Name:
          $VERSION_NAME_ACTUAL

          Version Code:
          $VERSION_CODE_ACTUAL

          APK SHA-256:
          $SHA256

          Build:
          GitHub Actions

          Flutter:
          3.44.8

          Java:
          17

          Gradle:
          8.14

          Android Gradle Plugin:
          8.11.1

          Release signing:
          Enabled

          Debug signing:
          Disabled

          ================================================
          EOF

          cat release/PuzzleWorld-release-info.txt


      # ============================================================
      # 26. UPLOAD GITHUB ARTIFACT
      # ============================================================

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release-apk
          path: |
            release/PuzzleWorld-release.apk
            release/PuzzleWorld-release-info.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PuzzleWorld-release.apk
            release/PuzzleWorld-release-info.txt
          name: Puzzle World ${{ env.VERSION_NAME }}
          body: |
            # Puzzle World ${{ env.VERSION_NAME }}

            ## Release Information

            **Package Name:** `com.ebrahassadi.puzzle_world`

            **Version Name:** `${{ env.VERSION_NAME }}`

            **Version Code:** `${{ env.VERSION_CODE }}`

            **Build:** GitHub Actions

            **Flutter:** 3.44.8

            **Java:** 17

            **Gradle:** 8.14

            **Android Gradle Plugin:** 8.11.1

            **Release Signing:** Enabled

            **Debug Signing:** Disabled

            The APK has been verified before release.
          draft: false
          prerelease: false