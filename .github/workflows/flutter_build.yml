name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # Check Android Project
      # ============================================================

      - name: Check Android Project
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."

          if [ ! -d "android" ]; then
            echo "ERROR: android folder does not exist."
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml does not exist."
            exit 1
          fi

          echo "Android project exists."


      # ============================================================
      # Generate Launcher Icons
      # ============================================================

      - name: Generate Android App Icon
        run: dart run flutter_launcher_icons


      # ============================================================
      # Decode Release Keystore
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Release keystore created successfully."


      # ============================================================
      # Create key.properties
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created successfully."


      # ============================================================
      # Fix Unity Ads JVM Target
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin found:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file; do

                echo "Checking:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else

            echo "Unity Ads plugin path not found."
            echo "Continuing..."

          fi


      # ============================================================
      # Flutter Clean
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get Again
        run: flutter pub get


      # ============================================================
      # Verify Launcher Icons
      # ============================================================

      - name: Verify Launcher Icons
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "LAUNCHER ICONS"
          echo "============================================================"

          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
              -o -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            | sort

          echo ""
          echo "Launcher icon check completed."


      # ============================================================
      # Build Release APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "Starting Flutter release build..."

          flutter build apk --release

          echo ""
          echo "BUILD SUCCESSFUL"


      # ============================================================
      # Upload Release APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error