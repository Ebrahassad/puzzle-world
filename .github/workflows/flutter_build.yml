name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # Flutter Clean
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # Flutter Pub Get Again
      # ============================================================

      - name: Flutter Pub Get Again
        run: flutter pub get


      # ============================================================
      # CREATE ANDROID LAUNCHER ICON
      #
      # IMPORTANT:
      # - No flutter_launcher_icons
      # - No adaptive icon
      # - No ic_launcher.xml
      # - No background layer
      # - No foreground layer
      #
      # The PNG is used directly.
      # ============================================================

      - name: Create Normal Android Launcher Icon
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"
          ICON="assets/icon/app_icon.png"

          echo ""
          echo "============================================================"
          echo "CREATING NORMAL ANDROID LAUNCHER ICON"
          echo "============================================================"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: App icon not found:"
            echo "$ICON"
            exit 1
          fi

          echo "App icon found:"
          echo "$ICON"

          echo ""
          echo "Removing ALL old launcher resources..."

          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*
          rm -rf "$RES"/drawable*/ic_launcher_round*

          echo ""
          echo "Creating normal mipmap directories..."

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          echo ""
          echo "Copying app_icon.png..."

          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo ""
          echo "Creating round launcher icon..."

          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo ""
          echo "Launcher icons created successfully."


      # ============================================================
      # VERIFY NO ADAPTIVE ICONS EXIST
      # ============================================================

      - name: Verify Launcher Icon Structure
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          echo ""
          echo "============================================================"
          echo "ANDROID RES STRUCTURE"
          echo "============================================================"

          find "$RES" \
            -maxdepth 3 \
            -type f \
            | sort

          echo ""
          echo "============================================================"
          echo "CHECKING FOR ADAPTIVE ICONS"
          echo "============================================================"

          if find "$RES" \
            -type f \
            \
              -path "*/mipmap-anydpi/*" \
              -o -path "*/mipmap-anydpi-v26/*" \
              -o -path "*/mipmap-anydpi-v27/*" \
              -o -path "*/drawable-anydpi-v24/*" \
              -o -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \
            | grep -q .; then

            echo ""
            echo "ERROR: Adaptive launcher icon resources still exist."
            echo ""
            find "$RES" \
              -type f \
              \
                -path "*/mipmap-anydpi/*" \
                -o -path "*/mipmap-anydpi-v26/*" \
                -o -path "*/mipmap-anydpi-v27/*" \
                -o -path "*/drawable-anydpi-v24/*" \
                -o -name "ic_launcher.xml" \
                -o -name "ic_launcher_round.xml" \
             

            exit 1

          else

            echo "OK: No adaptive launcher icons found."

          fi

          echo ""
          echo "============================================================"
          echo "NORMAL PNG LAUNCHER ICONS"
          echo "============================================================"

          find "$RES" \
            -type f \
            \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \
            | sort


      # ============================================================
      # Verify AndroidManifest
      # ============================================================

      - name: Verify Android Manifest
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "ANDROID MANIFEST ICON"
          echo "============================================================"

          grep -n 'android:icon\|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml \
            || true


      # ============================================================
      # Decode Release Keystore
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Release keystore created successfully."


      # ============================================================
      # Create key.properties
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created successfully."


      # ============================================================
      # Fix Unity Ads JVM target
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo ""
            echo "Unity Ads plugin found:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \
                -print0 |
              while IFS= read -r -d '' file; do

                echo ""
                echo "Checking:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space: