name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # CREATE ANDROID PROJECT FROM SCRATCH
      # ============================================================

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CREATING NEW ANDROID PROJECT"
          echo "============================================================"

          if [ -d "android" ]; then
            echo "Android folder already exists."
          else
            echo "Android folder does not exist."
            echo "Creating it now..."

            flutter create \
              --platforms=android \
              --org com.ebrahassad \
              .

          fi

          echo ""
          echo "Android project created successfully."

          echo ""
          echo "Checking Android folder..."

          ls -la android


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # SHOW GENERATED ANDROID STRUCTURE
      # ============================================================

      - name: Check Android Structure
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "ANDROID PROJECT STRUCTURE"
          echo "============================================================"

          find android -maxdepth 4 -type f | sort


      # ============================================================
      # CREATE NORMAL APP ICON
      #
      # IMPORTANT:
      # We do NOT use flutter_launcher_icons.
      # We do NOT create adaptive icons.
      # We use the PNG directly.
      # ============================================================

      - name: Create Normal App Icon
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"
          ICON="assets/icon/app_icon.png"

          echo ""
          echo "============================================================"
          echo "CREATING APP ICON"
          echo "============================================================"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Missing:"
            echo "$ICON"
            exit 1
          fi

          echo "Icon found."

          # Remove generated launcher resources
          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*

          # Create normal mipmap folders
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Copy original PNG WITHOUT modifying it
          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "App icon copied successfully."


      # ============================================================
      # ANDROID MANIFEST
      # ============================================================

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo ""
          echo "============================================================"
          echo "CONFIGURING ANDROID MANIFEST"
          echo "============================================================"

          sed -i \
            's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/' \
            "$MANIFEST"

          sed -i \
            's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/' \
            "$MANIFEST"

          echo "Manifest configured."


      # ============================================================
      # REMOVE ADAPTIVE ICON FILES
      # ============================================================

      - name: Remove Adaptive Icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          echo ""
          echo "Removing adaptive icon resources..."

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            -delete

          echo "Adaptive icons removed."


      # ============================================================
      # VERIFY ICON
      # ============================================================

      - name: Verify App Icon
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          echo ""
          echo "============================================================"
          echo "FINAL ICON CHECK"
          echo "============================================================"

          echo ""
          echo "Launcher PNG files:"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \) \
            | sort

          echo ""
          echo "Adaptive icon XML files:"

          if find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            | grep -q .; then

            echo "ERROR: Adaptive icon XML still exists."
            exit 1

          fi

          echo "NONE"

          echo ""
          echo "AndroidManifest:"

          grep -n \
            -E 'android:icon|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml \
            || true


      # ============================================================
      # DECODE RELEASE KEYSTORE
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Keystore created successfully."


      # ============================================================
      # CREATE KEY PROPERTIES
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # FIX UNITY ADS JVM
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file; do

                echo "Checking $file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else

            echo "Unity Ads plugin path not found."
            echo "Continuing."

          fi


      # ============================================================
      # FLUTTER CLEAN
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter Pub Get Final
        run: flutter pub get


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "BUILDING RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error