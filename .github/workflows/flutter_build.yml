name: Build Puzzle World Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

    tags:
      - "v*"

jobs:

  build:
    name: Build Puzzle World Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. FLUTTER 3.44.8
      # ============================================================

      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # 4. VERIFY FLUTTER
      # ============================================================

      - name: Verify Flutter
        shell: bash
        run: |
          set -e

          flutter --version

          echo ""
          echo "Dart:"
          dart --version

          echo ""
          echo "Java:"
          java -version


      # ============================================================
      # 5. CREATE ANDROID FROM ZERO
      #
      # IMPORTANT:
      # android was deleted from repository.
      #
      # This guarantees a completely fresh Android project.
      # ============================================================

      - name: Create fresh Android project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CREATING FRESH ANDROID PROJECT"
          echo "============================================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.ebrahassad \
            --project-name puzzle_world \
            --android-language kotlin \
            .

          echo ""
          echo "Android project created."

          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          echo ""
          echo "Android files:"
          find android -maxdepth 3 -type f | sort


      # ============================================================
      # 6. FORCE GRADLE 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        shell: bash
        run: |
          set -e

          FILE="android/gradle/wrapper/gradle-wrapper.properties"

          echo "============================================================"
          echo "CONFIGURING GRADLE 8.14"
          echo "============================================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Gradle wrapper file not found."
            exit 1
          fi

          sed -i \
            's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip#' \
            "$FILE"

          echo ""
          grep "distributionUrl" "$FILE"


      # ============================================================
      # 7. CONFIGURE AGP + KOTLIN
      #
      # AGP 8.11.1
      # Kotlin 2.2.10
      #
      # Gradle 8.14
      # Java 17
      # ============================================================

      - name: Configure Android Gradle Plugin and Kotlin
        shell: bash
        run: |
          set -e

          FILE="android/settings.gradle.kts"

          echo "============================================================"
          echo "CONFIGURING AGP AND KOTLIN"
          echo "============================================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # AGP
          text = re.sub(
              r'id"com\.android\.application"\s+version\s+"[^"]+"\s+apply\s+false',
              'id("com.android.application") version "8.11.1" apply false',
              text
          )

          # Kotlin
          text = re.sub(
              r'id"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.2.10" apply false',
              text
          )

          # Flutter loader stays untouched.
          path.write_text(text, encoding="utf-8")

          print("settings.gradle.kts configured.")
          PY

          echo ""
          grep -n \
            -E 'com.android.application|org.jetbrains.kotlin.android|dev.flutter' \
            "$FILE" \
            || true


      # ============================================================
      # 8. GRADLE PROPERTIES
      #
      # Keep legacy KGP/DSL mode because Flutter 3.44 supports it
      # and Unity Ads is a third-party Android plugin.
      # ============================================================

      - name: Configure Gradle properties
        shell: bash
        run: |
          set -e

          FILE="android/gradle.properties"

          cat > "$FILE" <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

          echo "gradle.properties:"
          cat "$FILE"


      # ============================================================
      # 9. CONFIGURE ANDROID APP
      #
      # Java 17
      # Kotlin JVM 17
      # compileSdk 35
      # minSdk 21
      # ============================================================

      - name: Configure Android app
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # compileSdk
          # --------------------------------------------------------

          text = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 35',
              text
          )

          text = re.sub(
              r'compileSdk\s*=\s*\d+',
              'compileSdk = 35',
              text,
              count=1
          )

          # --------------------------------------------------------
          # minSdk
          # --------------------------------------------------------

          text = re.sub(
              r'minSdk\s*=\s*flutter\.minSdkVersion',
              'minSdk = 21',
              text
          )

          text = re.sub(
              r'minSdk\s*=\s*\d+',
              'minSdk = 21',
              text,
              count=1
          )

          # --------------------------------------------------------
          # targetSdk
          # --------------------------------------------------------

          text = re.sub(
              r'targetSdk\s*=\s*flutter\.targetSdkVersion',
              'targetSdk = 35',
              text
          )

          text = re.sub(
              r'targetSdk\s*=\s*\d+',
              'targetSdk = 35',
              text,
              count=1
          )

          # --------------------------------------------------------
          # Java 17
          # --------------------------------------------------------

          text = text.replace(
              'JavaVersion.VERSION_11',
              'JavaVersion.VERSION_17'
          )

          text = text.replace(
              'JavaVersion.VERSION_1_8',