# ============================================================
      # Generate Android App Icon
      #
      # المصدر:
      # assets/icon/app_icon.png
      #
      # يتم استخدام الصورة كاملة بدون:
      # - خلفية
      # - padding
      # - extent
      # - قص
      # - تصغير إضافي داخل canvas
      # ============================================================

      - name: Generate Android App Icon
        shell: bash
        run: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          echo "=========================================="
          echo "Generating Android launcher icon"
          echo "=========================================="

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Icon not found:"
            echo "$SOURCE"
            exit 1
          fi

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # حذف أي أيقونات قديمة فقط
          rm -f "$RES/mipmap-mdpi/ic_launcher.png"
          rm -f "$RES/mipmap-hdpi/ic_launcher.png"
          rm -f "$RES/mipmap-xhdpi/ic_launcher.png"
          rm -f "$RES/mipmap-xxhdpi/ic_launcher.png"
          rm -f "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # ========================================================
          # إنشاء الأحجام القياسية
          #
          # الصورة تملأ الـ canvas بالكامل.
          # لا يتم إضافة أي خلفية أو مساحة حول الأيقونة.
          # ========================================================

          convert "$SOURCE" \
            -strip \
            -resize 48x48! \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$SOURCE" \
            -strip \
            -resize 72x72! \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$SOURCE" \
            -strip \
            -resize 96x96! \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$SOURCE" \
            -strip \
            -resize 144x144! \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$SOURCE" \
            -strip \
            -resize 192x192! \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo ""
          echo "Generated icons:"

          find "$RES" \
            -type f \
            -name "ic_launcher.png" \
            -print

          echo ""
          echo "Icon generation completed successfully."