name: Flutter Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 📦 Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 🐦 Setup Flutter
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      # ============================================================
      # ☕ Setup Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 🔐 Setup Release Keystore
      # ============================================================
      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/puzzle-world-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../puzzle-world-release.jks
          EOF

          echo "Release signing configuration created."

      # ============================================================
      # 📊 حجم assets قبل الضغط
      # ============================================================
      - name: Check assets size BEFORE compression
        run: |
          echo "========================================"
          echo "ASSETS SIZE BEFORE COMPRESSION"
          echo "========================================"

          du -sh assets

          echo ""
          echo "Images size:"
          du -sh assets/images

          echo ""
          echo "PNG files:"
          find assets -type f -iname "*.png" | wc -l

          echo ""
          echo "Puzzle images:"
          du -sh assets/images/Puzzle 2>/dev/null || true

      # ============================================================
      # 🦀 Setup Rust
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ============================================================
      # 🗜️ تثبيت oxipng
      # ============================================================
      - name: Install PNG optimizer
        run: |
          cargo install oxipng --locked
          oxipng --version

      # ============================================================
      # 🗜️ ضغط جميع PNG
      # ============================================================
      - name: Optimize all PNG images
        run: |
          find assets -type f -iname "*.png" -print0 | \
          xargs -0 -r oxipng \
            -o 4 \
            --strip safe \
            --preserve

      # ============================================================
      # 📊 حجم assets بعد الضغط
      # ============================================================
      - name: Check assets size AFTER compression
        run: |
          echo "========================================"
          echo "ASSETS SIZE AFTER COMPRESSION"
          echo "========================================"

          du -sh assets

          echo ""
          echo "Images size:"
          du -sh assets/images

          echo ""
          echo "PNG files:"
          find assets -type f -iname "*.png" | wc -l

          echo ""
          echo "Puzzle images:"
          du -sh assets/images/Puzzle 2>/dev/null || true

      # ============================================================
      # 📊 تقرير تفصيلي
      # ============================================================
      - name: Compression report
        run: |
          echo "========================================"
          echo "COMPRESSION REPORT"
          echo "========================================"

          echo ""
          echo "Assets total:"
          du -sh assets

          echo ""
          echo "World:"
          du -sh assets/images/world 2>/dev/null || true

          echo ""
          echo "Islands:"
          du -sh assets/images/islands 2>/dev/null || true

          echo ""
          echo "Puzzle:"
          du -sh assets/images/Puzzle 2>/dev/null || true

          echo ""
          echo "Background:"
          du -sh assets/images/background 2>/dev/null || true

          echo ""
          echo "UI:"
          du -sh assets/images/ui 2>/dev/null || true

          echo ""
          echo "Rewards:"
          du -sh assets/images/rewards 2>/dev/null || true

          echo ""
          echo "Largest files:"
          find assets -type f -printf '%s %p\n' | \
          sort -nr | \
          head -20 | \
          awk '{printf "%.2f MB  %s\n", $1/1024/1024, $2}'

      # ============================================================
      # 📚 Flutter dependencies
      # ============================================================
      - name: Flutter pub get
        run: flutter pub get

      # ============================================================
      # 🧹 Flutter clean
      # ============================================================
      - name: Flutter clean
        run: flutter clean

      # ============================================================
      # 📚 Dependencies after clean
      # ============================================================
      - name: Flutter pub get after clean
        run: flutter pub get

      # ============================================================
      # 🖼️ Generate App Icon
      # ============================================================
      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # ============================================================
      # 🔍 Verify Keystore
      # ============================================================
      - name: Verify Release Signing
        run: |
          echo "========================================"
          echo "VERIFYING RELEASE SIGNING"
          echo "========================================"

          test -f android/puzzle-world-release.jks
          test -f android/key.properties

          echo "Release keystore found."
          echo "Signing configuration found."

      # ============================================================
      # 🏗️ Build Release APK
      # ============================================================
      - name: Build APK
        run: flutter build apk --release

      # ============================================================
      # 📦 فحص حجم APK
      # ============================================================
      - name: Check APK size
        run: |
          echo "========================================"
          echo "FINAL APK SIZE"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/

          echo ""
          du -h build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 📤 Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-apk
          path: build/app/outputs/flutter-apk/app-release.apk