name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # CHECK FLUTTER
      # ============================================================

      - name: Flutter Doctor
        run: flutter doctor -v


      # ============================================================
      # CREATE ANDROID PROJECT FROM SCRATCH
      #
      # android folder was deleted from the repository.
      # Flutter recreates it here.
      # ============================================================

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CREATING ANDROID PROJECT FROM SCRATCH"
          echo "============================================================"

          if [ -d "android" ]; then
            echo "ERROR: android folder already exists."
            echo "This workflow expects android to be deleted from the repository."
            exit 1
          fi

          flutter create \
            --platforms=android \
            --org com.ebrahassad \
            --project-name puzzle_world \
            .

          echo ""
          echo "Android project created."

          test -d android

          echo ""
          echo "Android directory:"
          ls -la android


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # CREATE NORMAL LAUNCHER ICON
      #
      # IMPORTANT:
      #
      # We copy the ORIGINAL PNG exactly as it is.
      #
      # No:
      # flutter_launcher_icons
      # adaptive icon
      # foreground
      # background
      # XML launcher
      # image processing
      #
      # ============================================================

      - name: Create Normal Launcher Icon
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"
          ICON="assets/icon/app_icon.png"

          echo "============================================================"
          echo "CREATING NORMAL LAUNCHER ICON"
          echo "============================================================"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Icon not found:"
            echo "$ICON"
            exit 1
          fi

          echo "Using:"
          echo "$ICON"

          # Remove Flutter generated launcher resources
          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*
          rm -rf "$RES"/drawable*/ic_launcher_round*

          # Create normal mipmap folders
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Copy ORIGINAL PNG without changing it
          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Round icon points to same original PNG
          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Launcher PNG files created."


      # ============================================================
      # CONFIGURE MANIFEST
      # ============================================================

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "============================================================"
          echo "CONFIGURING ANDROID MANIFEST"
          echo "============================================================"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          if 'android:roundIcon=' in text:
              import re
              text = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  text
              )

          path.write_text(text)
          PY

          grep -n -E 'android:icon|android:roundIcon' "$MANIFEST" || true


      # ============================================================
      # REMOVE ADAPTIVE ICONS
      # ============================================================

      - name: Remove Adaptive Icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          echo "Removing adaptive icon resources..."

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) \
            -delete

          echo "Adaptive icon resources removed."


      # ============================================================
      # VERIFY ICON
      # ============================================================

      - name: Verify Launcher Icon
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          echo "============================================================"
          echo "VERIFYING LAUNCHER ICON"
          echo "============================================================"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            test -f "$RES/mipmap-$density/ic_launcher.png"
            test -f "$RES/mipmap-$density/ic_launcher_round.png"

          done

          if find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) | grep -q .; then

            echo "ERROR: Adaptive launcher XML found."
            exit 1

          fi

          echo ""
          echo "Launcher icons:"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \) \
            | sort

          echo ""
          echo "ICON CHECK PASSED."


      # ============================================================
      # DECODE RELEASE KEYSTORE
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Release keystore created."


      # ============================================================
      # CREATE KEY PROPERTIES
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure Release Signing
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          echo "============================================================"
          echo "CONFIGURING RELEASE SIGNING"
          echo "============================================================"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          if 'import java.util.Properties' not in text:
              text = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + text

          signing_block = r'''
          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''

          if 'keystorePropertiesFile' not in text:
              text = text.replace(
                  'android {',
                  signing_block + 'android {',
                  1
              )

          if 'signingConfigs {' not in text:
              text = text.replace(
                  'android {',
                  '''android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(file as String) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }

              ''',
                  1
              )

          text = text.replace(
              'buildTypes {',
              '''buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }

              ''',
              1
          )

          path.write_text(text)
          PY

          echo "Release signing configured."


      # ============================================================
      # UNITY ADS JVM FIX
      # ============================================================

      - name: Fix Unity Ads JVM Target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file; do

                echo "Checking:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else

            echo "Unity Ads plugin not found."
            echo "Continuing..."

          fi


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter Pub Get Final
        run: flutter pub get


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILDING RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error