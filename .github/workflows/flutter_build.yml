name: Build Puzzle World Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

    tags:
      - "v*"

# ============================================================
# GITHUB PERMISSIONS
# ============================================================

permissions:
  contents: write

jobs:

  build:
    name: Build Puzzle World Release APK
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. JAVA 17
      # ========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================================
      # 3. FLUTTER 3.44.8
      # ========================================================

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ========================================================
      # 4. VERIFY FLUTTER
      # ========================================================

      - name: Verify Flutter
        run: |
          set -e

          flutter --version
          dart --version


      # ========================================================
      # 5. DELETE AND RECREATE ANDROID
      # ========================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "RECREATING ANDROID PROJECT"
          echo "============================================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.ebrahassadi \
            --project-name puzzle_world \
            .

          test -d android
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts

          echo "Android project created successfully."


      # ========================================================
      # 6. SET GRADLE 8.14
      # ========================================================

      - name: Configure Gradle 8.14
        shell: bash
        run: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - "$WRAPPER" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'distributionUrl=.*',
              r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip',
              text
          )

          path.write_text(text)
          PY

          echo "Gradle version:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties


      # ========================================================
      # 7. AGP 8.11.1 + KOTLIN 2.2.20
      # ========================================================

      - name: Configure Android Gradle Plugin and Kotlin
        shell: bash
        run: |
          set -e

          SETTINGS="android/settings.gradle.kts"

          python3 - "$SETTINGS" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.11.1\g<2>',
              text
          )

          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              r'\g<1>2.2.20\g<2>',
              text
          )

          path.write_text(text)
          PY

          echo "Android settings:"
          cat android/settings.gradle.kts


      # ========================================================
      # 8. PUB GET
      # ========================================================

      - name: Flutter pub get
        run: flutter pub get


      # ========================================================
      # 9. JAVA 17 CONFIGURATION
      # ========================================================

      - name: Configure Android Java 17
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)
          PY

          echo "Java 17 configured."


      # ========================================================
      # 10. LAUNCHER ICON
      # ========================================================

      - name: Install normal PNG launcher icon
        shell: bash
        run: |
          set -e

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: $ICON does not exist."
            exit 1
          fi

          echo "Installing Puzzle World icon..."

          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            mkdir -p "$RES/mipmap-$density"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "Launcher icon installed."


      # ========================================================
      # 11. REMOVE ADAPTIVE ICONS
      # ========================================================

      - name: Remove adaptive icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          echo "Adaptive icons removed."


      # ========================================================
      # 12. ANDROID MANIFEST
      # ========================================================

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              '''<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"''',
              1
          )

          path.write_text(text)
          PY

          grep -n \
            -E 'android:icon|android:roundIcon' \
            "$MANIFEST"


      # ========================================================
      # 13. RELEASE KEYSTORE
      # ========================================================

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Release keystore created."


      # ========================================================
      # 14. KEY PROPERTIES
      # ========================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ========================================================
      # 15. CONFIGURE RELEASE SIGNING
      # ========================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # ----------------------------------------------------
          # Imports
          # ----------------------------------------------------

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          # ----------------------------------------------------
          # Keystore properties loader
          # ----------------------------------------------------

          if "val keystorePropertiesFile" not in text:

              loader = '''
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          '''

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          # ----------------------------------------------------
          # Release signing config
          # ----------------------------------------------------

          if 'create("release")' not in text:

              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          '''

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          # ----------------------------------------------------
          # CRITICAL:
          # Remove EVERY existing release signing assignment.
          # ----------------------------------------------------

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              ''
          )

          text = text.replace(
              'signingConfig = signingConfigs.debug',
              ''
          )

          # ----------------------------------------------------
          # Ensure release uses release keystore.
          # ----------------------------------------------------

          release_block = '''
              release {
                  signingConfig =
                      signingConfigs.getByName("release")
              }
          '''

          import re

          text = re.sub(
              r'buildTypes\s*\{.*?\n\s*\}',
              lambda m: m.group(0),
              text,
              count=1,
              flags=re.S
          )

          # If release block does not contain release signing,
          # insert it.
          if (
              'release {\n            signingConfig =' not in text
              and 'release {\n                  signingConfig =' not in text
          ):
              text = text.replace(
                  "release {",
                  '''release {
                      signingConfig =
                          signingConfigs.getByName("release")''',
                  1
              )

          path.write_text(text)

          print("Release signing configured.")
          PY


      # ========================================================
      # 16. VERIFY PACKAGE + SIGNING CONFIG
      # ========================================================

      - name: Verify package and signing configuration
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "EXPECTED PACKAGE"
          echo "============================================================"

          EXPECTED_PACKAGE="com.ebrahassadi.puzzle_world"

          grep -n \
            'namespace =' \
            android/app/build.gradle.kts

          grep -n \
            'applicationId =' \
            android/app/build.gradle.kts

          echo ""
          echo "Expected:"
          echo "$EXPECTED_PACKAGE"

          echo ""
          echo "============================================================"
          echo "CHECKING FOR DEBUG SIGNING"
          echo "============================================================"

          if grep -q \
            'signingConfigs.getByName("debug")' \
            android/app/build.gradle.kts
          then
            echo "ERROR: DEBUG SIGNING IS STILL PRESENT."
            exit 1
          fi

          echo "No debug signing found."

          echo ""
          echo "============================================================"
          echo "KEY PROPERTIES"
          echo "============================================================"

          grep -E \
            '^(storeFile|keyAlias)=' \
            android/key.properties

          echo ""
          echo "Release signing configuration verified."


      # ========================================================
      # 17. UNITY ADS JVM COMPATIBILITY
      # ========================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          echo "Searching Unity Ads plugin..."

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path
          do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file
              do

                echo "Patching:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else
            echo "Unity Ads plugin not found."
            echo "This is not necessarily an error."
          fi


      # ========================================================
      # 18. FLUTTER CLEAN
      # ========================================================

      - name: Flutter clean
        run: |
          set -e

          flutter clean


      # ========================================================
      # 19. PUB GET FINAL
      # ========================================================

      - name: Flutter pub get final
        run: |
          set -e

          flutter pub get


      # ========================================================
      # 20. VERIFY GRADLE
      # ========================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew --version


      # ========================================================
      # 21. BUILD RELEASE APK
      # ========================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk \
            --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo ""
          echo "BUILD SUCCESSFUL."

          mkdir -p release

          cp "$APK" \
            "release/PuzzleWorld-release.apk"

          ls -lh \
            "release/PuzzleWorld-release.apk"


      # ========================================================
      # 22. VERIFY APK PACKAGE
      # ========================================================

      - name: Verify APK package
        shell: bash
        run: |
          set -e

          APK="release/PuzzleWorld-release.apk"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          echo "============================================================"
          echo "APK PACKAGE INFORMATION"
          echo "============================================================"

          BADGING=$(
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
              dump badging "$APK"
          )

          echo "$BADGING" | head -20

          echo ""
          echo "============================================================"
          echo "CHECKING PACKAGE NAME"
          echo "============================================================"

          EXPECTED_PACKAGE="com.ebrahassadi.puzzle_world"

          ACTUAL_PACKAGE=$(
            echo "$BADGING" |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )

          echo "Expected package:"
          echo "$EXPECTED_PACKAGE"

          echo "Actual package:"
          echo "$ACTUAL_PACKAGE"

          if [ "$ACTUAL_PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo ""
            echo "ERROR: PACKAGE NAME IS WRONG."
            exit 1
          fi

          echo ""
          echo "PACKAGE NAME VERIFIED."


      # ========================================================
      # 23. VERIFY APK SIGNATURE
      # ========================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="release/PuzzleWorld-release.apk"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          echo "============================================================"
          echo "APK SIGNATURE"
          echo "============================================================"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK signature verification successful."


      # ========================================================
      # 24. EXTRACT APK CERTIFICATE SHA256
      # ========================================================

      - name: Extract APK certificate SHA256
        shell: bash
        run: |
          set -e

          APK="release/PuzzleWorld-release.apk"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          echo "============================================================"
          echo "APK CERTIFICATE"
          echo "============================================================"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"


      # ========================================================
      # 25. SHA256
      # ========================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          APK="release/PuzzleWorld-release.apk"

          sha256sum "$APK" \
            | tee release/PuzzleWorld-release.apk.sha256


      # ========================================================
      # 26. CREATE RELEASE INFORMATION
      # ========================================================

      - name: Create release information
        shell: bash
        run: |
          set -e

          APK="release/PuzzleWorld-release.apk"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          BADGING=$(
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
              dump badging "$APK"
          )

          PACKAGE=$(
            echo "$BADGING" |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )

          VERSION_NAME=$(
            echo "$BADGING" |
            sed -n \
              "s/.*versionName='\([^']*\)'.*/\1/p" |
            head -1
          )

          VERSION_CODE=$(
            echo "$BADGING" |
            sed -n \
              "s/.*versionCode='\([^']*\)'.*/\1/p" |
            head -1
          )

          SHA256=$(
            sha256sum "$APK" |
            awk '{print $1}'
          )

          cat > release/PuzzleWorld-release-info.txt <<EOF
          Puzzle World
          ================================================

          Package Name:
          $PACKAGE

          Version Name:
          $VERSION_NAME

          Version Code:
          $VERSION_CODE

          APK SHA-256:
          $SHA256

          Build:
          GitHub Actions

          Flutter:
          3.44.8

          Java:
          17

          Gradle:
          8.14

          Android Gradle Plugin:
          8.11.1

          Release signing:
          Enabled

          Debug signing:
          Disabled

          ================================================
          EOF

          cat release/PuzzleWorld-release-info.txt


      # ========================================================
      # 27. UPLOAD ARTIFACT
      # ========================================================

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release-apk
          path: |
            release/PuzzleWorld-release.apk
            release/PuzzleWorld-release.apk.sha256
            release/PuzzleWorld-release-info.txt
          if-no-files-found: error
          retention-days: 30


      # ========================================================
      # 28. CREATE GITHUB RELEASE
      # ========================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}

          name: Puzzle World ${{ github.ref_name }}

          generate_release_notes: true

          files: |
            release/PuzzleWorld-release.apk
            release/PuzzleWorld-release.apk.sha256
            release/PuzzleWorld-release-info.txt

          fail_on_unmatched_files: true
