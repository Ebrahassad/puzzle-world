name: Flutter Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 📦 Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 🐦 Setup Flutter
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable


      # ============================================================
      # ☕ Setup Java 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 🔎 Check project
      # ============================================================

      - name: Check pubspec.yaml
        run: |
          pwd
          ls -la
          echo "===================="
          sed -n '1,160p' pubspec.yaml
          echo "===================="


      # ============================================================
      # 📚 Dependencies
      # ============================================================

      - name: Flutter pub get
        run: flutter pub get


      # ============================================================
      # 📺 Check Unity Ads
      # ============================================================

      - name: Check Unity Ads version
        run: |
          flutter pub deps | grep unity_ads_plugin || true


      # ============================================================
      # 🧹 Clean
      # ============================================================

      - name: Flutter clean
        run: flutter clean


      # ============================================================
      # 📚 Get dependencies after clean
      # ============================================================

      - name: Flutter pub get after clean
        run: flutter pub get


      # ============================================================
      # 🖼️ Generate App Icon
      # ============================================================

      - name: Generate App Icon
        run: dart run flutter_launcher_icons


      # ============================================================
      # 🏗️ Build APK
      # ============================================================

      - name: Build APK
        run: flutter build apk --release


      # ============================================================
      # 📤 Upload APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-apk
          path: build/app/outputs/flutter-apk/app-release.apk