name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # Install ImageMagick
      # ============================================================

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ============================================================
      # Generate Android App Icon
      #
      # Source:
      # assets/icon/app_icon.png
      #
      # Background color:
      # android/app/src/main/res/values/colors.xml
      #
      # يتم أخذ splash_color من colors.xml
      #
      # مهم:
      # - لا يوجد extent
      # - لا توجد مساحة شفافة إضافية
      # - لا يتم تصغير الأيقونة داخل مربع أكبر
      # - الخلفية تكون بنفس لون التطبيق البنفسجي
      # ============================================================

      - name: Generate Android App Icon
        shell: bash
        run: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"
          COLORS_FILE="$RES/values/colors.xml"

          echo "=========================================="
          echo "Generating Android application icon"
          echo "=========================================="

          # --------------------------------------------------------
          # التأكد من وجود الصورة
          # --------------------------------------------------------

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: App icon not found:"
            echo "$SOURCE"
            exit 1
          fi

          # --------------------------------------------------------
          # التأكد من وجود colors.xml
          # --------------------------------------------------------

          if [ ! -f "$COLORS_FILE" ]; then
            echo "ERROR: colors.xml not found:"
            echo "$COLORS_FILE"
            exit 1
          fi

          # --------------------------------------------------------
          # قراءة splash_color من colors.xml
          # مثال:
          #
          # <color name="splash_color">#6A1B9A</color>
          # --------------------------------------------------------

          SPLASH_COLOR=$(sed -n \
            's/.*<color[[:space:]]\+name="splash_color">[[:space:]]*\([^<]*\)[[:space:]]*<\/color>.*/\1/p' \
            "$COLORS_FILE" |
            head -n 1)

          if [ -z "$SPLASH_COLOR" ]; then
            echo "ERROR: splash_color was not found in colors.xml"
            exit 1
          fi

          echo "Icon source:"
          echo "$SOURCE"

          echo "Background color:"
          echo "$SPLASH_COLOR"

          # --------------------------------------------------------
          # إنشاء مجلدات الأيقونات
          # --------------------------------------------------------

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # --------------------------------------------------------
          # توليد الأيقونة
          #
          # الصورة الأصلية يتم وضعها على خلفية بنفسجية.
          #
          # لا نستخدم extent.
          # لا نضيف padding.
          #
          # resize WxH! يجعل الصورة تملأ أبعاد الأيقونة
          # بالكامل.
          # --------------------------------------------------------

          convert "$SOURCE" \
            -background "$SPLASH_COLOR" \
            -alpha remove \
            -alpha off \
            -resize 48x48! \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert "$SOURCE" \
            -background "$SPLASH_COLOR" \
            -alpha remove \
            -alpha off \
            -resize 72x72! \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert "$SOURCE" \
            -background "$SPLASH_COLOR" \
            -alpha remove \
            -alpha off \
            -resize 96x96! \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert "$SOURCE" \
            -background "$SPLASH_COLOR" \
            -alpha remove \
            -alpha off \
            -resize 144x144! \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert "$SOURCE" \
            -background "$SPLASH_COLOR" \
            -alpha remove \
            -alpha off \
            -resize 192x192! \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo ""
          echo "Generated launcher icons:"
          find "$RES" \
            -type f \
            -name "ic_launcher.png" \
            -print


      # ============================================================
      # Decode Release Keystore
      #
      # Secret:
      # KEYSTORE_BASE64
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Release keystore created successfully."


      # ============================================================
      # Create key.properties
      #
      # Secrets:
      # KEYSTORE_PASSWORD
      # KEY_ALIAS
      # KEY_PASSWORD
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created successfully."


      # ============================================================
      # Fix Unity Ads JVM target
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin found:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -print0 |
              while IFS= read -r -d '' file; do

                echo "Checking:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else

            echo "Unity Ads plugin path not found."
            echo "Continuing..."

          fi


      # ============================================================
      # Flutter Clean
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # Flutter Pub Get Again
      # ============================================================

      - name: Flutter Pub Get Again
        run: flutter pub get


      # ============================================================
      # Build Release APK
      # ============================================================

      - name: Build Release APK
        run: flutter build apk --release


      # ============================================================
      # Upload Release APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error