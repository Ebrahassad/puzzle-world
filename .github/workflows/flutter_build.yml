name: Build Puzzle World Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

    tags:
      - "v*"

permissions:
  contents: write

env:
  PACKAGE_NAME: com.ebrahassadi.puzzle_world
  VERSION_NAME: "1.0.2"
  VERSION_CODE: "3"
  FLUTTER_VERSION: "3.44.8"
  GRADLE_VERSION: "8.14"
  AGP_VERSION: "8.11.1"
  KOTLIN_VERSION: "2.2.20"

jobs:

  build:

    name: Build Puzzle World Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      # ============================================================
      # 4. VERIFY TOOLS
      # ============================================================

      - name: Verify tools
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "FLUTTER"
          echo "============================================================"

          flutter --version

          echo ""
          echo "============================================================"
          echo "DART"
          echo "============================================================"

          dart --version

          echo ""
          echo "============================================================"
          echo "JAVA"
          echo "============================================================"

          java -version


      # ============================================================
      # 5. RECREATE ANDROID
      # ============================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "RECREATING ANDROID PROJECT"
          echo "============================================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.ebrahassadi \
            --project-name puzzle_world \
            .

          test -d android
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts

          echo "Android project created."


      # ============================================================
      # 6. CONFIGURE EXACT PACKAGE + VERSION
      # ============================================================

      - name: Configure Package and Version
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" "$PACKAGE_NAME" "$VERSION_NAME" "$VERSION_CODE" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          package_name = sys.argv[2]
          version_name = sys.argv[3]
          version_code = sys.argv[4]

          text = path.read_text()

          # --------------------------------------------------------
          # namespace
          # --------------------------------------------------------

          text = re.sub(
              r'^\s*namespace\s*=\s*"[^"]*"\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # applicationId
          # --------------------------------------------------------

          text = re.sub(
              r'^\s*applicationId\s*=\s*"[^"]*"\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # versionCode
          # --------------------------------------------------------

          text = re.sub(
              r'^\s*versionCode\s*=\s*[^\n]*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # versionName
          # --------------------------------------------------------

          text = re.sub(
              r'^\s*versionName\s*=\s*"[^"]*"\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # Add namespace immediately after android {
          # --------------------------------------------------------

          text = text.replace(
              "android {",
              f'''android {{

              namespace = "{package_name}"''',
              1
          )

          # --------------------------------------------------------
          # Add exact applicationId/version inside defaultConfig
          # --------------------------------------------------------

          text = text.replace(
              "defaultConfig {",
              f'''defaultConfig {{

                  applicationId = "{package_name}"

                  versionCode = {version_code}

                  versionName = "{version_name}"''',
              1
          )

          path.write_text(text)

          print("Package and version configured.")
          PY


      # ============================================================
      # 7. CONFIGURE KOTLIN PACKAGE
      # ============================================================

      - name: Configure Kotlin package
        shell: bash
        run: |
          set -e

          if [ -d "android/app/src/main/kotlin" ]; then

            while IFS= read -r file
            do
              sed -i \
                -E 's/^package .*/package com.ebrahassadi.puzzle_world/' \
                "$file"

            done < <(
              find android/app/src/main/kotlin \
                -type f \
                -name "*.kt"
            )

          fi

          echo "Kotlin package:"
          grep -R \
            "^package " \
            android/app/src/main/kotlin \
            2>/dev/null || true


      # ============================================================
      # 8. GRADLE 8.14
      # ============================================================

      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - "$WRAPPER" "$GRADLE_VERSION" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          version = sys.argv[2]

          text = path.read_text()

          text = re.sub(
              r'^distributionUrl=.*$',
              f'distributionUrl=https\\://services.gradle.org/distributions/gradle-{version}-all.zip',
              text,
              flags=re.MULTILINE
          )

          path.write_text(text)
          PY

          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 9. AGP + KOTLIN
      # ============================================================

      - name: Configure AGP and Kotlin
        shell: bash
        run: |
          set -e

          SETTINGS="android/settings.gradle.kts"

          python3 - "$SETTINGS" "$AGP_VERSION" "$KOTLIN_VERSION" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          agp = sys.argv[2]
          kotlin = sys.argv[3]

          text = path.read_text()

          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              rf'\g<1>{agp}\g<2>',
              text
          )

          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              rf'\g<1>{kotlin}\g<2>',
              text
          )

          path.write_text(text)
          PY

          cat android/settings.gradle.kts


      # ============================================================
      # 10. PUB GET
      # ============================================================

      - name: Flutter pub get
        run: flutter pub get


      # ============================================================
      # 11. JAVA 17
      # ============================================================

      - name: Configure Java 17
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)
          PY


      # ============================================================
      # 12. INSTALL ICON
      # ============================================================

      - name: Install Puzzle World launcher icon
        shell: bash
        run: |
          set -e

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: $ICON not found."
            exit 1
          fi

          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            mkdir -p "$RES/mipmap-$density"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher_round.png"

          done

          echo "Icon installed."


      # ============================================================
      # 13. REMOVE ADAPTIVE ICONS
      # ============================================================

      - name: Remove adaptive icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true


      # ============================================================
      # 14. MANIFEST
      # ============================================================

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              '''<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"''',
              1
          )

          path.write_text(text)
          PY

          grep -n \
            -E 'android:icon|android:roundIcon' \
            "$MANIFEST"


      # ============================================================
      # 15. KEYSTORE
      # ============================================================

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Release keystore created."


      # ============================================================
      # 16. KEY PROPERTIES
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # 17. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # --------------------------------------------------------
          # Imports
          # --------------------------------------------------------

          if "import java.util.Properties" not in text:

              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          # --------------------------------------------------------
          # Keystore properties
          # --------------------------------------------------------

          if "val keystorePropertiesFile" not in text:

              block = '''
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          '''

              text = text.replace(
                  "android {",
                  block + "android {",
                  1
              )

          # --------------------------------------------------------
          # Release signing config
          # --------------------------------------------------------

          if 'create("release")' not in text:

              signing = '''
              signingConfigs {
                  create("release") {

                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          '''

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          # --------------------------------------------------------
          # Remove every existing signingConfig from release block
          # --------------------------------------------------------

          marker = "buildTypes {"

          if marker not in text:
              raise SystemExit("ERROR: buildTypes block not found.")

          before, after = text.split(marker, 1)

          # Only operate on the buildTypes section.
          after = after.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              ''
          )

          after = after.replace(
              'signingConfig = signingConfigs.getByName("release")',
              ''
          )

          # Add one exact release signing config.
          if 'release {' not in after:
              raise SystemExit("ERROR: release buildType not found.")

          after = after.replace(
              "release {",
              '''release {

              signingConfig =
                  signingConfigs.getByName("release")''',
              1
          )

          text = before + marker + after

          path.write_text(text)

          print("Release signing configured.")
          PY


      # ============================================================
      # 18. FINAL CONFIGURATION CHECK
      # ============================================================

      - name: Verify final configuration
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          echo "============================================================"
          echo "BUILD.GRADLE.KTS"
          echo "============================================================"

          cat "$APP"

          echo ""
          echo "============================================================"
          echo "PACKAGE VALIDATION"
          echo "============================================================"

          NAMESPACE=$(grep \
            -E '^[[:space:]]*namespace[[:space:]]*=' \
            "$APP" |
            sed -E 's/.*"([^"]+)".*/\1/' |
            head -1)

          APPLICATION_ID=$(grep \
            -E '^[[:space:]]*applicationId[[:space:]]*=' \
            "$APP" |
            sed -E 's/.*"([^"]+)".*/\1/' |
            head -1)

          echo "Namespace: $NAMESPACE"
          echo "Application ID: $APPLICATION_ID"

          if [ "$NAMESPACE" != "$PACKAGE_NAME" ]; then
            echo "ERROR: Wrong namespace."
            exit 1
          fi

          if [ "$APPLICATION_ID" != "$PACKAGE_NAME" ]; then
            echo "ERROR: Wrong applicationId."
            exit 1
          fi

          echo "Package name: OK"


          echo ""
          echo "============================================================"
          echo "FORBIDDEN PACKAGE CHECK"
          echo "============================================================"

          if grep -R \
            -n \
            "com.ebrahassadi\.\*\*\*" \
            android \
            --exclude-dir=.gradle \
            --exclude="*.lock" \
            2>/dev/null
          then
            echo "ERROR: Forbidden package found."
            exit 1
          fi

          echo "Forbidden package: NOT FOUND"


          echo ""
          echo "============================================================"
          echo "DEBUG SIGNING CHECK"
          echo "============================================================"

          if grep -n \
            'signingConfigs.getByName("debug")' \
            "$APP"
          then
            echo "ERROR: Debug signing detected."
            exit 1
          fi

          echo "Debug signing: NOT USED"


          echo ""
          echo "============================================================"
          echo "RELEASE SIGNING CHECK"
          echo "============================================================"

          if ! grep -n \
            'signingConfigs.getByName("release")' \
            "$APP"
          then
            echo "ERROR: Release signing not configured."
            exit 1
          fi

          echo "Release signing: ENABLED"


          echo ""
          echo "============================================================"
          echo "VERSION"
          echo "============================================================"

          grep -n "versionCode" "$APP"
          grep -n "versionName" "$APP"


      # ============================================================
      # 19. UNITY ADS JVM COMPATIBILITY
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path
          do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file
              do

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else
            echo "Unity Ads plugin not found."
          fi


      # ============================================================
      # 20. CLEAN
      # ============================================================

      - name: Flutter clean
        run: flutter clean


      # ============================================================
      # 21. PUB GET
      # ============================================================

      - name: Flutter pub get final
        run: flutter pub get


      # ============================================================
      # 22. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew --version


      # ============================================================
      # 23. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

          test -f \
            build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 24. PREPARE RELEASE
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/PuzzleWorld-release.apk

          ls -lh \
            release/PuzzleWorld-release.apk


      # ============================================================
      # 25. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="release/PuzzleWorld-release.apk"

          BUILD_TOOLS=$(ls \
            "$ANDROID_HOME/build-tools" |
            sort -V |
            tail -1)

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          BADGING=$(
            "$AAPT" dump badging "$APK"
          )

          PACKAGE=$(
            echo "$BADGING" |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )

          APK_VERSION_NAME=$(
            echo "$BADGING" |
            sed -n \
              "s/.*versionName='\([^']*\)'.*/\1/p" |
            head -1
          )

          APK_VERSION_CODE=$(
            echo "$BADGING" |
            sed -n \
              "s/.*versionCode='\([^']*\)'.*/\1/p" |
            head -1
          )

          SHA256=$(
            sha256sum "$APK" |
            awk '{print $1}'
          )


          echo "============================================================"
          echo "FINAL APK"
          echo "============================================================"

          echo "Package Name:"
          echo "$PACKAGE"

          echo ""
          echo "Version Name:"
          echo "$APK_VERSION_NAME"

          echo ""
          echo "Version Code:"
          echo "$APK_VERSION_CODE"

          echo ""
          echo "APK SHA-256:"
          echo "$SHA256"


          # --------------------------------------------------------
          # Validate package
          # --------------------------------------------------------

          if [ "$PACKAGE" != "$PACKAGE_NAME" ]; then

            echo ""
            echo "ERROR: PACKAGE NAME MISMATCH"
            echo "Expected: $PACKAGE_NAME"
            echo "Actual:   $PACKAGE"

            exit 1
          fi


          # --------------------------------------------------------
          # Validate version
          # --------------------------------------------------------

          if [ "$APK_VERSION_NAME" != "$VERSION_NAME" ]; then

            echo ""
            echo "ERROR: VERSION NAME MISMATCH"

            exit 1
          fi


          if [ "$APK_VERSION_CODE" != "$VERSION_CODE" ]; then

            echo ""
            echo "ERROR: VERSION CODE MISMATCH"

            exit 1
          fi


          # --------------------------------------------------------
          # Verify APK signature
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "APK SIGNATURE VERIFICATION"
          echo "============================================================"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"


          # --------------------------------------------------------
          # Print certificate fingerprints
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "SIGNING CERTIFICATE"
          echo "============================================================"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK"


          # --------------------------------------------------------
          # APK size
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "APK SIZE"
          echo "============================================================"

          ls -lh "$APK"


          # --------------------------------------------------------
          # Release info
          # --------------------------------------------------------

          cat > release/PuzzleWorld-release-info.txt <<EOF
          Puzzle World
          ================================================

          Package Name:
          $PACKAGE

          Version Name:
          $APK_VERSION_NAME

          Version Code:
          $APK_VERSION_CODE

          APK SHA-256:
          $SHA256

          Build:
          GitHub Actions

          Flutter:
          $FLUTTER_VERSION

          Java:
          17

          Gradle:
          $GRADLE_VERSION

          Android Gradle Plugin:
          $AGP_VERSION

          Kotlin:
          $KOTLIN_VERSION

          Release signing:
          Enabled

          Debug signing:
          Disabled

          ================================================
          EOF

          cat release/PuzzleWorld-release-info.txt


      # ============================================================
      # 26. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release-apk
          path: |
            release/PuzzleWorld-release.apk
            release/PuzzleWorld-release-info.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:

          tag_name: ${{ github.ref_name }}

          name: Puzzle World ${{ env.VERSION_NAME }}

          body: |
            # Puzzle World ${{ env.VERSION_NAME }}

            ## Release Information

            **Package Name:** `com.ebrahassadi.puzzle_world`

            **Version Name:** `${{ env.VERSION_NAME }}`

            **Version Code:** `${{ env.VERSION_CODE }}`

            **Build:** GitHub Actions

            **Flutter:** ${{ env.FLUTTER_VERSION }}

            **Java:** 17

            **Gradle:** ${{ env.GRADLE_VERSION }}

            **Android Gradle Plugin:** ${{ env.AGP_VERSION }}

            **Kotlin:** ${{ env.KOTLIN_VERSION }}

            **Release Signing:** Enabled

            **Debug Signing:** Disabled

            The APK was package-verified, version-verified and signature-verified before release.

          files: |
            release/PuzzleWorld-release.apk
            release/PuzzleWorld-release-info.txt

          draft: false
          prerelease: false