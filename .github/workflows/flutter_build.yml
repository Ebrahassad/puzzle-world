name: Build Puzzle World Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. FLUTTER
      # ============================================================

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # 4. VERIFY FLUTTER
      # ============================================================

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version


      # ============================================================
      # 5. CREATE ANDROID FROM SCRATCH
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CREATING ANDROID PROJECT"
          echo "============================================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.ebrahassad \
            --project-name puzzle_world \
            .

          test -d android
          test -f android/app/build.gradle.kts

          echo ""
          echo "Android project created successfully."


      # ============================================================
      # 6. INSPECT GENERATED ANDROID
      # ============================================================

      - name: Inspect generated Android
        run: |
          echo "===== ANDROID ====="
          find android -maxdepth 3 -type f | sort

          echo "===== MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml

          echo "===== APP GRADLE ====="
          cat android/app/build.gradle.kts

          echo "===== SETTINGS ====="
          cat android/settings.gradle.kts


      # ============================================================
      # 7. FORCE GRADLE 8.14
      # ============================================================

      - name: Set Gradle 8.14
        shell: bash
        run: |
          set -e

          sed -i \
            's#gradle-[0-9.]*-all.zip#gradle-8.14-all.zip#g' \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle wrapper:"
          cat android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 8. FORCE AGP 8.11.1 + KOTLIN 2.2.20
      # ============================================================

      - name: Configure Android Gradle versions
        shell: bash
        run: |
          set -e

          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/com.android.application version "[^"]*"/com.android.application version "8.11.1"/' \
              android/settings.gradle.kts

            sed -i \
              's/org.jetbrains.kotlin.android version "[^"]*"/org.jetbrains.kotlin.android version "2.2.20"/' \
              android/settings.gradle.kts

          fi

          echo ""
          echo "Android settings:"
          cat android/settings.gradle.kts


      # ============================================================
      # 9. FLUTTER PUB GET
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # 10. CREATE NORMAL PNG LAUNCHER ICON
      # ============================================================

      - name: Install launcher icon
        shell: bash
        run: |
          set -e

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          echo "============================================================"
          echo "INSTALLING LAUNCHER ICON"
          echo "============================================================"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Missing icon:"
            echo "$ICON"
            exit 1
          fi

          # Remove all generated launcher resources
          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*
          rm -rf "$RES"/drawable*/ic_launcher_round*

          # Create normal mipmap folders
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Copy ORIGINAL PNG directly
          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Launcher icon installed."


      # ============================================================
      # 11. REMOVE ADAPTIVE ICONS
      # ============================================================

      - name: Remove adaptive icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete

          echo "Adaptive icon resources removed."


      # ============================================================
      # 12. CONFIGURE MANIFEST
      # ============================================================

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i \
            's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' \
            "$MANIFEST"

          if grep -q "android:roundIcon=" "$MANIFEST"; then

            sed -i \
              's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' \
              "$MANIFEST"

          else

            sed -i \
              's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher_round"/' \
              "$MANIFEST"

          fi

          echo ""
          grep -n \
            -E 'android:icon|android:roundIcon' \
            "$MANIFEST"


      # ============================================================
      # 13. CONFIGURE JAVA 17
      # ============================================================

      - name: Configure Java 17
        shell: bash
        run: |
          set -e

          APP_GRADLE="android/app/build.gradle.kts"

          sed -i \
            's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            "$APP_GRADLE"

          sed -i \
            's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' \
            "$APP_GRADLE"

          sed -i \
            's/jvmTarget = "1.8"/jvmTarget = "17"/g' \
            "$APP_GRADLE"

          sed -i \
            's/jvmTarget = "11"/jvmTarget = "17"/g' \
            "$APP_GRADLE"

          echo ""
          echo "Java/Kotlin target configured."


      # ============================================================
      # 14. DECODE RELEASE KEYSTORE
      # ============================================================

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore created."


      # ============================================================
      # 15. CREATE KEY.PROPERTIES
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # 16. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          APP_GRADLE="android/app/build.gradle.kts"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + text

          loader = '''
          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''

          if 'val keystorePropertiesFile' not in text:
              text = text.replace(
                  'android {',
                  loader + 'android {',
                  1
              )

          if 'create("release")' not in text:
              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let {
                          rootProject.file(it as String)
                      }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }

              '''

              text = text.replace(
                  'android {',
                  'android {\n' + signing,
                  1
              )

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              text = text.replace(
                  'buildTypes {',
                  '''buildTypes {
                      getByName("release") {
                          signingConfig = signingConfigs.getByName("release")
                      }''',
                  1
              )

          path.write_text(text)
          print("Release signing configured successfully.")
          PY


      # ============================================================
      # 17. SHOW FINAL BUILD.GRADLE.KTS
      # ============================================================

      - name: Verify Android Gradle configuration
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "android/app/build.gradle.kts"
          echo "============================================================"

          cat android/app/build.gradle.kts

          echo ""
          echo "============================================================"
          echo "Gradle wrapper"
          echo "============================================================"

          cat android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 18. UNITY ADS JVM FIX
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file; do

                echo "Checking $file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else
            echo "Unity Ads plugin path not found."
          fi


      # ============================================================
      # 19. CLEAN
      # ============================================================

      - name: Flutter clean
        run: flutter clean


      # ============================================================
      # 20. PUB GET
      # ============================================================

      - name: Flutter pub get
        run: flutter pub get


      # ============================================================
      # 21. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk --release

          echo ""
          echo "============================================================"
          echo "BUILD SUCCESSFUL"
          echo "============================================================"


      # ============================================================
      # 22. UPLOAD APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30