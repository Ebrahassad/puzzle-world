name: Build Puzzle World Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. FLUTTER 3.44.8
      # ============================================================

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # 4. VERIFY FLUTTER
      # ============================================================

      - name: Verify Flutter
        run: |
          set -e

          flutter --version
          dart --version


      # ============================================================
      # 5. DELETE AND RECREATE ANDROID
      # ============================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "RECREATING ANDROID PROJECT"
          echo "============================================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.ebrahassadi \
            --project-name puzzle_world \
            .

          test -d android
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts

          echo "Android project created successfully."


      # ============================================================
      # 6. SET GRADLE 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        shell: bash
        run: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - "$WRAPPER" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip',
              text
          )

          path.write_text(text)
          PY

          echo "Gradle version:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 7. AGP 8.11.1 + KOTLIN 2.2.20
      # ============================================================

      - name: Configure Android Gradle Plugin and Kotlin
        shell: bash
        run: |
          set -e

          SETTINGS="android/settings.gradle.kts"

          python3 - "$SETTINGS" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              r'\g<1>8.11.1\g<2>',
              text
          )

          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              r'\g<1>2.2.20\g<2>',
              text
          )

          path.write_text(text)
          PY

          echo "Android settings:"
          cat android/settings.gradle.kts


      # ============================================================
      # 8. PUB GET
      # ============================================================

      - name: Flutter pub get
        run: flutter pub get


      # ============================================================
      # 9. CONFIGURE ANDROID SDK / JAVA 17
      # ============================================================

      - name: Configure Android Java 17
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)
          PY

          echo "Java 17 configured."


      # ============================================================
      # 10. LAUNCHER ICON
      # ============================================================

      - name: Install normal PNG launcher icon
        shell: bash
        run: |
          set -e

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: $ICON does not exist."
            exit 1
          fi

          echo "Installing Puzzle World icon..."

          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            mkdir -p "$RES/mipmap-$density"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "Launcher icon installed."


      # ============================================================
      # 11. REMOVE ADAPTIVE ICONS
      # ============================================================

      - name: Remove adaptive icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          echo "Adaptive icons removed."


      # ============================================================
      # 12. MANIFEST
      # ============================================================

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          text = text.replace(
              "<application",
              '''<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"''',
              1
          )

          path.write_text(text)
          PY

          grep -n \
            -E 'android:icon|android:roundIcon' \
            "$MANIFEST"


      # ============================================================
      # 13. RELEASE KEYSTORE
      # ============================================================

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Release keystore created."


      # ============================================================
      # 14. KEY PROPERTIES
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # 15. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          if "val keystorePropertiesFile" not in text:

              loader = '''
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          '''

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          if 'create("release")' not in text:

              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          '''

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          if 'signingConfig = signingConfigs.getByName("release")' not in text:

              text = text.replace(
                  "release {",
                  '''release {
                      signingConfig =
                          signingConfigs.getByName("release")''',
                  1
              )

          path.write_text(text)

          print("Release signing configured correctly.")
          PY


      # ============================================================
      # 16. VERIFY SIGNING CONFIG
      # ============================================================

      - name: Verify signing configuration
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILD.GRADLE.KTS"
          echo "============================================================"

          cat android/app/build.gradle.kts

          echo ""
          echo "============================================================"
          echo "GRADLE WRAPPER"
          echo "============================================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "============================================================"
          echo "KEY PROPERTIES"
          echo "============================================================"

          grep -E \
            '^(storeFile|keyAlias)=' \
            android/key.properties


      # ============================================================
      # 17. UNITY ADS JVM COMPATIBILITY
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          echo "Searching Unity Ads plugin..."

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path
          do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file
              do

                echo "Patching:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else
            echo "Unity Ads plugin not found."
            echo "This is not necessarily an error."
          fi


      # ============================================================
      # 18. FLUTTER CLEAN
      # ============================================================

      - name: Flutter clean
        run: |
          set -e

          flutter clean


      # ============================================================
      # 19. PUB GET AGAIN
      # ============================================================

      - name: Flutter pub get final
        run: |
          set -e

          flutter pub get


      # ============================================================
      # 20. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew --version


      # ============================================================
      # 21. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk \
            --release

          test -f \
            build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 22. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "============================================================"
          echo "APK"
          echo "============================================================"

          ls -lh "$APK"

          echo ""
          echo "============================================================"
          echo "SHA256"
          echo "============================================================"

          sha256sum "$APK"

          echo ""
          echo "============================================================"
          echo "APK PACKAGE INFORMATION"
          echo "============================================================"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            dump badging "$APK" | head -20

          echo ""
          echo "============================================================"
          echo "APK SIGNATURE"
          echo "============================================================"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"


      # ============================================================
      # 23. UPLOAD APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30