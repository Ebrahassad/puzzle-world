name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # Flutter Clean
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # Flutter Pub Get Again
      # ============================================================

      - name: Flutter Pub Get Again
        run: flutter pub get


      # ============================================================
      # Remove Old Android Adaptive Icon Files
      # ============================================================

      - name: Remove Old Android Adaptive Icon Files
        shell: bash
        run: |
          set -e

          echo "Removing old Android adaptive icon resources..."

          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi
          rm -rf android/app/src/main/res/drawable-anydpi-v24

          echo "Adaptive icon directories removed."


      # ============================================================
      # Generate Android App Icon
      # ============================================================

      - name: Generate Android App Icon
        run: dart run flutter_launcher_icons


      # ============================================================
      # Ensure Normal PNG Launcher Icon
      # ============================================================

      - name: Ensure Normal PNG Launcher Icon
        shell: bash
        run: |
          set -e

          echo "Checking generated launcher resources..."

          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi
          rm -rf android/app/src/main/res/drawable-anydpi-v24

          echo ""
          echo "Launcher icon files:"

          find android/app/src/main/res \
            -type f \
            \( -name "ic_launcher.png" -o -name "ic_launcher_round.png" \) \
            | sort || true


      # ============================================================
      # Decode Release Keystore
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Release keystore created successfully."


      # ============================================================
      # Create key.properties
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created successfully."


      # ============================================================
      # Fix Unity Ads JVM target
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin found:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -print0 |
              while IFS= read -r -d '' file; do

                echo "Checking:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else

            echo "Unity Ads plugin path not found."
            echo "Continuing..."

          fi


      # ============================================================
      # Final Launcher Icon Check
      # ============================================================

      - name: Final Launcher Icon Check
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "ANDROID RES STRUCTURE"
          echo "============================================================"

          find android/app/src/main/res \
            -maxdepth 3 \
            -type f \
            | sort

          echo ""
          echo "============================================================"
          echo "CHECKING FOR ADAPTIVE ICONS"
          echo "============================================================"

          if find android/app/src/main/res \
            -type f \
            \( -path "*/mipmap-anydpi-v26/*" \
            -o -path "*/mipmap-anydpi/*" \
            -o -path "*/drawable-anydpi-v24/*" \) \
            | grep -q .; then

            echo "ERROR: Adaptive icon files still exist."
            exit 1

          else

            echo "OK: No adaptive icon files found."

          fi

          echo ""
          echo "============================================================"
          echo "LAUNCHER PNG FILES"
          echo "============================================================"

          find android/app/src/main/res \
            -type f \
            \( -name "ic_launcher.png" \
            -o -name "ic_launcher_round.png" \) \
            | sort


      # ============================================================
      # Build Release APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "Starting Flutter release build..."

          for attempt in 1 2 3; do

            echo ""
            echo "============================================================"
            echo "BUILD ATTEMPT $attempt / 3"
            echo "============================================================"

            if flutter build apk --release; then

              echo ""
              echo "============================================================"
              echo "BUILD SUCCESSFUL"
              echo "============================================================"

              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then

              echo ""
              echo "Build failed. Waiting 20 seconds before retry..."

              sleep 20

            fi

          done

          echo ""
          echo "============================================================"
          echo "BUILD FAILED AFTER 3 ATTEMPTS"
          echo "============================================================"

          exit 1


      # ============================================================
      # Upload Release APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error