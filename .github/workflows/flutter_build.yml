name: Build Puzzle World Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:
    name: Build Puzzle World Release APK
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: com.ebrahassadi.puzzle_world
      VERSION_NAME: "1.0.2"
      VERSION_CODE: "3"

      FLUTTER_VERSION: "3.44.8"
      GRADLE_VERSION: "8.14"
      AGP_VERSION: "8.11.1"
      KOTLIN_VERSION: "2.2.20"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. FLUTTER 3.44.8
      # ============================================================

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # 4. VERIFY TOOLS
      # ============================================================

      - name: Verify tools
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "FLUTTER"
          echo "============================================================"

          flutter --version

          echo ""
          echo "============================================================"
          echo "DART"
          echo "============================================================"

          dart --version

          echo ""
          echo "============================================================"
          echo "JAVA"
          echo "============================================================"

          java -version

          echo ""
          echo "============================================================"
          echo "BUILD CONFIGURATION"
          echo "============================================================"

          echo "Package Name: $PACKAGE_NAME"
          echo "Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
          echo "Flutter: $FLUTTER_VERSION"
          echo "Gradle: $GRADLE_VERSION"
          echo "AGP: $AGP_VERSION"
          echo "Kotlin: $KOTLIN_VERSION"


      # ============================================================
      # 5. RECREATE ANDROID PROJECT
      # ============================================================

      - name: Recreate Android project
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "RECREATING ANDROID PROJECT"
          echo "============================================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.ebrahassadi \
            --project-name puzzle_world \
            .

          test -d android
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project created successfully."


      # ============================================================
      # 6. FORCE PACKAGE NAME + VERSION
      # ============================================================

      - name: Configure exact package and version
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" "$PACKAGE_NAME" "$VERSION_NAME" "$VERSION_CODE" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          package_name = sys.argv[2]
          version_name = sys.argv[3]
          version_code = sys.argv[4]

          text = path.read_text()

          # Remove previous namespace.
          text = re.sub(
              r'^\s*namespace\s*=\s*"[^"]*"\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove previous applicationId.
          text = re.sub(
              r'^\s*applicationId\s*=\s*"[^"]*"\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove previous versionCode.
          text = re.sub(
              r'^\s*versionCode\s*=\s*[^\n]*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove previous versionName.
          text = re.sub(
              r'^\s*versionName\s*=\s*"[^"]*"\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Add namespace.
          text = text.replace(
              "android {",
              f'''android {{
              namespace = "{package_name}"''',
              1
          )

          # Add exact applicationId and version.
          text = text.replace(
              "defaultConfig {",
              f'''defaultConfig {{
                  applicationId = "{package_name}"
                  versionCode = {version_code}
                  versionName = "{version_name}"''',
              1
          )

          path.write_text(text)
          PY

          echo ""
          echo "============================================================"
          echo "PACKAGE"
          echo "============================================================"

          grep -n "namespace" "$APP"
          grep -n "applicationId" "$APP"

          echo ""
          echo "============================================================"
          echo "VERSION"
          echo "============================================================"

          grep -n "versionCode" "$APP"
          grep -n "versionName" "$APP"


      # ============================================================
      # 7. CONFIGURE KOTLIN PACKAGE
      # ============================================================

      - name: Configure Android Kotlin package
        shell: bash
        run: |
          set -e

          if [ -d "android/app/src/main/kotlin" ]; then

            while IFS= read -r file
            do
              echo "Updating Kotlin package:"
              echo "$file"

              sed -i \
                -E "s/^package .*/package ${PACKAGE_NAME}/" \
                "$file"

            done < <(
              find android/app/src/main/kotlin \
                -type f \
                -name "*.kt"
            )

          fi

          echo ""
          echo "============================================================"
          echo "KOTLIN PACKAGE"
          echo "============================================================"

          grep -R \
            "^package " \
            android/app/src/main/kotlin \
            2>/dev/null || true


      # ============================================================
      # 8. CONFIGURE GRADLE 8.14
      # ============================================================

      - name: Configure Gradle 8.14
        shell: bash
        run: |
          set -e

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          python3 - "$WRAPPER" "$GRADLE_VERSION" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          gradle_version = sys.argv[2]

          text = path.read_text()

          text = re.sub(
              r'distributionUrl=.*',
              f'distributionUrl=https\\://services.gradle.org/distributions/gradle-{gradle_version}-all.zip',
              text
          )

          path.write_text(text)
          PY

          echo "Gradle wrapper:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 9. AGP 8.11.1 + KOTLIN 2.2.20
      # ============================================================

      - name: Configure Android Gradle Plugin and Kotlin
        shell: bash
        run: |
          set -e

          SETTINGS="android/settings.gradle.kts"

          python3 - "$SETTINGS" "$AGP_VERSION" "$KOTLIN_VERSION" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          agp_version = sys.argv[2]
          kotlin_version = sys.argv[3]

          text = path.read_text()

          text = re.sub(
              r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(")',
              rf'\g<1>{agp_version}\g<2>',
              text
          )

          text = re.sub(
              r'(id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+")[^"]+(")',
              rf'\g<1>{kotlin_version}\g<2>',
              text
          )

          path.write_text(text)
          PY

          echo "============================================================"
          echo "ANDROID SETTINGS"
          echo "============================================================"

          cat android/settings.gradle.kts


      # ============================================================
      # 10. JAVA 17 / KOTLIN JVM 17
      # ============================================================

      - name: Configure Java 17
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          path.write_text(text)
          PY

          echo "Java 17 configured."


      # ============================================================
      # 11. PUB GET
      # ============================================================

      - name: Flutter pub get
        shell: bash
        run: |
          set -e

          flutter pub get


      # ============================================================
      # 12. INSTALL NORMAL PNG LAUNCHER ICON
      # ============================================================

      - name: Install normal PNG launcher icon
        shell: bash
        run: |
          set -e

          ICON="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: $ICON does not exist."
            exit 1
          fi

          echo "Installing Puzzle World launcher icon..."

          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          rm -rf "$RES"/drawable*/ic_launcher*

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            mkdir -p "$RES/mipmap-$density"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher.png"

            cp "$ICON" \
              "$RES/mipmap-$density/ic_launcher_round.png"
          done

          echo "Launcher icon installed successfully."


      # ============================================================
      # 13. REMOVE ADAPTIVE ICONS
      # ============================================================

      - name: Remove adaptive icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v27"
          rm -rf "$RES/drawable-anydpi-v24"

          find "$RES" \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -delete || true

          echo "Adaptive icons removed."


      # ============================================================
      # 14. CONFIGURE MANIFEST
      # ============================================================

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          # Remove existing icon declarations.
          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text
          )

          text = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              '',
              text
          )

          # Add normal PNG launcher icons.
          text = text.replace(
              "<application",
              '''<application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"''',
              1
          )

          path.write_text(text)
          PY

          echo "Manifest launcher icons:"
          grep -n \
            -E 'android:icon|android:roundIcon' \
            "$MANIFEST"


      # ============================================================
      # 15. DECODE RELEASE KEYSTORE
      # ============================================================

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Release keystore created."

          echo ""
          echo "Keystore location:"
          ls -lh android/app/upload-keystore.jks


      # ============================================================
      # 16. CREATE KEY.PROPERTIES
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

          echo "key.properties created."

          echo ""
          echo "Signing properties:"
          grep -E \
            '^(storeFile|keyAlias)=' \
            android/key.properties


      # ============================================================
      # 17. CONFIGURE RELEASE SIGNING
      # ============================================================

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          # --------------------------------------------------------
          # Imports
          # --------------------------------------------------------

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          # --------------------------------------------------------
          # Keystore loader
          # --------------------------------------------------------

          if "val keystorePropertiesFile" not in text:

              loader = '''
          val keystorePropertiesFile =
              rootProject.file("key.properties")

          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(keystorePropertiesFile)
              )
          }

          '''

              text = text.replace(
                  "android {",
                  loader + "android {",
                  1
              )

          # --------------------------------------------------------
          # Release signing config
          # --------------------------------------------------------

          if 'create("release")' not in text:

              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties["keyAlias"] as String?

                      keyPassword =
                          keystoreProperties["keyPassword"] as String?

                      storePassword =
                          keystoreProperties["storePassword"] as String?

                      storeFile =
                          keystoreProperties["storeFile"]?.let {
                              rootProject.file(it as String)
                          }
                  }
              }

          '''

              text = text.replace(
                  "android {",
                  "android {\n" + signing,
                  1
              )

          # --------------------------------------------------------
          # Remove debug signing from release
          # --------------------------------------------------------

          text = re.sub(
              r'^\s*signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # Ensure release uses release signing
          # --------------------------------------------------------

          if 'signingConfig = signingConfigs.getByName("release")' not in text:

              text = text.replace(
                  "release {",
                  '''release {
                      signingConfig =
                          signingConfigs.getByName("release")''',
                  1
              )

          path.write_text(text)

          print("Release signing configured successfully.")
          PY


      # ============================================================
      # 18. VERIFY SIGNING FILES
      # ============================================================

      - name: Verify signing files
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "KEYSTORE"
          echo "============================================================"

          test -f android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

          ls -lh android/app/upload-keystore.jks

          echo ""
          echo "============================================================"
          echo "KEY PROPERTIES"
          echo "============================================================"

          test -f android/key.properties

          grep -E \
            '^(storeFile|keyAlias)=' \
            android/key.properties

          echo ""
          echo "============================================================"
          echo "GRADLE SIGNING CONFIG"
          echo "============================================================"

          grep -n \
            "signingConfig" \
            android/app/build.gradle.kts || true


      # ============================================================
      # 19. VERIFY PACKAGE
      # ============================================================

      - name: Verify package configuration
        shell: bash
        run: |
          set -e

          APP="android/app/build.gradle.kts"

          echo "============================================================"
          echo "PACKAGE CHECK"
          echo "============================================================"

          grep -n "namespace" "$APP"
          grep -n "applicationId" "$APP"

          echo ""
          echo "============================================================"
          echo "VERSION CHECK"
          echo "============================================================"

          grep -n "versionCode" "$APP"
          grep -n "versionName" "$APP"

          echo ""
          echo "============================================================"
          echo "INVALID PACKAGE CHECK"
          echo "============================================================"

          if grep -R \
            -n \
            "com.ebrahassadi\.\*\*\*" \
            android \
            --exclude-dir=.gradle \
            --exclude="*.lock" \
            2>/dev/null
          then
            echo ""
            echo "ERROR: Invalid package name detected."
            exit 1
          fi

          echo "No invalid *** package detected."

          echo ""
          echo "============================================================"
          echo "EXPECTED PACKAGE"
          echo "============================================================"

          echo "$PACKAGE_NAME"


      # ============================================================
      # 20. UNITY ADS JVM COMPATIBILITY
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          echo "Searching Unity Ads plugin..."

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path
          do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file
              do

                echo "Patching:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']11["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else
            echo "Unity Ads plugin not found."
            echo "Continuing..."
          fi


      # ============================================================
      # 21. FLUTTER CLEAN
      # ============================================================

      - name: Flutter clean
        shell: bash
        run: |
          set -e

          flutter clean


      # ============================================================
      # 22. FINAL PUB GET
      # ============================================================

      - name: Flutter pub get final
        shell: bash
        run: |
          set -e

          flutter pub get


      # ============================================================
      # 23. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew --version


      # ============================================================
      # 24. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BUILDING PUZZLE WORLD RELEASE APK"
          echo "============================================================"

          flutter build apk \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

          test -f \
            build/app/outputs/flutter-apk/app-release.apk

          echo ""
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 25. PREPARE RELEASE FILES
      # ============================================================

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/PuzzleWorld-release.apk

          echo "Release APK:"
          ls -lh \
            release/PuzzleWorld-release.apk


      # ============================================================
      # 26. VERIFY FINAL APK
      # ============================================================

      - name: Verify final APK
        shell: bash
        run: |
          set -e

          APK="release/PuzzleWorld-release.apk"

          BUILD_TOOLS=$(
            ls "$ANDROID_HOME/build-tools" |
            sort -V |
            tail -1
          )

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          echo "============================================================"
          echo "APK BADGING"
          echo "============================================================"

          BADGING=$(
            "$AAPT" dump badging "$APK"
          )

          PACKAGE=$(
            echo "$BADGING" |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )

          VERSION_NAME_ACTUAL=$(
            echo "$BADGING" |
            sed -n \
              "s/.*versionName='\([^']*\)'.*/\1/p" |
            head -1
          )

          VERSION_CODE_ACTUAL=$(
            echo "$BADGING" |
            sed -n \
              "s/.*versionCode='\([^']*\)'.*/\1/p" |
            head -1
          )

          echo "Package Name:"
          echo "$PACKAGE"

          echo ""
          echo "Version Name:"
          echo "$VERSION_NAME_ACTUAL"

          echo ""
          echo "Version Code:"
          echo "$VERSION_CODE_ACTUAL"


          # --------------------------------------------------------
          # Validate package
          # --------------------------------------------------------

          if [ "$PACKAGE" != "$PACKAGE_NAME" ]; then
            echo ""
            echo "ERROR: Package Name mismatch."
            echo "Expected: $PACKAGE_NAME"
            echo "Actual:   $PACKAGE"
            exit 1
          fi


          # --------------------------------------------------------
          # Validate version name
          # --------------------------------------------------------

          if [ "$VERSION_NAME_ACTUAL" != "$VERSION_NAME" ]; then
            echo ""
            echo "ERROR: Version Name mismatch."
            echo "Expected: $VERSION_NAME"
            echo "Actual:   $VERSION_NAME_ACTUAL"
            exit 1
          fi


          # --------------------------------------------------------
          # Validate version code
          # --------------------------------------------------------

          if [ "$VERSION_CODE_ACTUAL" != "$VERSION_CODE" ]; then
            echo ""
            echo "ERROR: Version Code mismatch."
            echo "Expected: $VERSION_CODE"
            echo "Actual:   $VERSION_CODE_ACTUAL"
            exit 1
          fi


          echo ""
          echo "============================================================"
          echo "IDENTITY VALIDATION"
          echo "============================================================"

          echo "Package Name: OK"
          echo "Version Name: OK"
          echo "Version Code: OK"


          # --------------------------------------------------------
          # SHA-256
          # --------------------------------------------------------

          SHA256=$(
            sha256sum "$APK" |
            awk '{print $1}'
          )

          echo ""
          echo "============================================================"
          echo "APK SHA-256"
          echo "============================================================"

          echo "$SHA256"


          # --------------------------------------------------------
          # APK signature
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "APK SIGNATURE"
          echo "============================================================"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"


          # --------------------------------------------------------
          # Certificate
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "APK SIGNING CERTIFICATE"
          echo "============================================================"

          "$APKSIGNER" \
            verify \
            --print-certs \
            "$APK"


          # --------------------------------------------------------
          # APK size
          # --------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "APK SIZE"
          echo "============================================================"

          ls -lh "$APK"


          # --------------------------------------------------------
          # Release information file
          # --------------------------------------------------------

          cat > release/PuzzleWorld-release-info.txt <<EOF
          Puzzle World
          ================================================

          Package Name:
          $PACKAGE

          Version Name:
          $VERSION_NAME_ACTUAL

          Version Code:
          $VERSION_CODE_ACTUAL

          APK SHA-256:
          $SHA256

          Build:
          GitHub Actions

          Flutter:
          $FLUTTER_VERSION

          Java:
          17

          Gradle:
          $GRADLE_VERSION

          Android Gradle Plugin:
          $AGP_VERSION

          Kotlin:
          $KOTLIN_VERSION

          Release signing:
          Enabled

          Debug signing:
          Disabled

          ================================================
          EOF

          echo ""
          echo "============================================================"
          echo "RELEASE INFO"
          echo "============================================================"

          cat release/PuzzleWorld-release-info.txt


      # ============================================================
      # 27. UPLOAD GITHUB ARTIFACT
      # ============================================================

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release-apk
          path: |
            release/PuzzleWorld-release.apk
            release/PuzzleWorld-release-info.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 28. CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}

          name: Puzzle World ${{ env.VERSION_NAME }}

          body: |
            # Puzzle World ${{ env.VERSION_NAME }}

            ## Release

            Official release build of Puzzle World.

            ### Application

            **Package Name:** `com.ebrahassadi.puzzle_world`

            **Version Name:** `${{ env.VERSION_NAME }}`

            **Version Code:** `${{ env.VERSION_CODE }}`

            ### Build Environment

            **Flutter:** ${{ env.FLUTTER_VERSION }}

            **Java:** 17

            **Gradle:** ${{ env.GRADLE_VERSION }}

            **Android Gradle Plugin:** ${{ env.AGP_VERSION }}

            **Kotlin:** ${{ env.KOTLIN_VERSION }}

            ### Security

            **Release Signing:** Enabled

            **Debug Signing:** Disabled

            The APK was built and verified by GitHub Actions.

            The package name, version, APK signature and SHA-256 checksum were verified before publishing this release.

          files: |
            release/PuzzleWorld-release.apk
            release/PuzzleWorld-release-info.txt

          draft: false
          prerelease: false
          generate_release_notes: true