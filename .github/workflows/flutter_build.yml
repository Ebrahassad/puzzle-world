name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # Flutter Clean
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # Flutter Pub Get Again
      # ============================================================

      - name: Flutter Pub Get Again
        run: flutter pub get


      # ============================================================
      # CREATE NORMAL ANDROID LAUNCHER ICON
      #
      # Uses assets/icon/app_icon.png directly.
      #
      # NO flutter_launcher_icons
      # NO adaptive icon
      # NO XML launcher icon
      # NO foreground
      # NO background
      # ============================================================

      - name: Create Normal Android Launcher Icon
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"
          ICON="assets/icon/app_icon.png"

          echo ""
          echo "============================================================"
          echo "CREATING NORMAL ANDROID LAUNCHER ICON"
          echo "============================================================"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: App icon not found:"
            echo "$ICON"
            exit 1
          fi

          echo "App icon found:"
          echo "$ICON"

          echo ""
          echo "Removing old launcher resources..."

          rm -rf "$RES"/mipmap-*
          rm -rf "$RES"/drawable-anydpi*
          
          find "$RES" -type f \
            \( -name "ic_launcher*" -o -name "ic_launcher_round*" \) \
            -delete

          echo ""
          echo "Creating mipmap directories..."

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          echo ""
          echo "Copying app icon..."

          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$ICON" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$ICON" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo ""
          echo "Launcher icons created successfully."


      # ============================================================
      # VERIFY LAUNCHER ICONS
      # ============================================================

      - name: Verify Launcher Icon Structure
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          echo ""
          echo "============================================================"
          echo "ANDROID RES STRUCTURE"
          echo "============================================================"

          find "$RES" -maxdepth 3 -type f | sort

          echo ""
          echo "============================================================"
          echo "CHECKING FOR ADAPTIVE ICONS"
          echo "============================================================"

          ADAPTIVE_FOUND=0

          if find "$RES" -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
            \) | grep -q .; then

            ADAPTIVE_FOUND=1

          fi

          if find "$RES" -type d \
            \( \
              -name "mipmap-anydpi" \
              -o -name "mipmap-anydpi-v26" \
              -o -name "mipmap-anydpi-v27" \
              -o -name "drawable-anydpi-v24" \
            \) | grep -q .; then

            ADAPTIVE_FOUND=1

          fi

          if [ "$ADAPTIVE_FOUND" -eq 1 ]; then

            echo ""
            echo "ERROR: Adaptive launcher icon resources found."

            find "$RES" \
              \( \
                -name "ic_launcher.xml" \
                -o -name "ic_launcher_round.xml" \
              \) -print || true

            exit 1

          fi

          echo "OK: No adaptive launcher icons found."

          echo ""
          echo "============================================================"
          echo "NORMAL PNG LAUNCHER ICONS"
          echo "============================================================"

          find "$RES" -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher_round.png" \
            \) | sort

          echo ""
          echo "============================================================"
          echo "CHECKING REQUIRED ICONS"
          echo "============================================================"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do

            if [ ! -f "$RES/mipmap-$density/ic_launcher.png" ]; then
              echo "ERROR: Missing ic_launcher.png in mipmap-$density"
              exit 1
            fi

            if [ ! -f "$RES/mipmap-$density/ic_launcher_round.png" ]; then
              echo "ERROR: Missing ic_launcher_round.png in mipmap-$density"
              exit 1
            fi

          done

          echo ""
          echo "OK: All launcher PNG files exist."


      # ============================================================
      # Verify Android Manifest
      # ============================================================

      - name: Verify Android Manifest
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "ANDROID MANIFEST"
          echo "============================================================"

          grep -n \
            -E 'android:icon|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml \
            || true


      # ============================================================
      # Decode Release Keystore
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Release keystore created successfully."


      # ============================================================
      # Create key.properties
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created successfully."


      # ============================================================
      # Fix Unity Ads JVM target
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=""

          while IFS= read -r path; do
            UNITY_PLUGIN_PATH="$path"
            break
          done < <(
            find "$HOME/.pub-cache" \
              -type d \
              -path "*/unity_ads_plugin-*" \
              2>/dev/null
          )

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo ""
            echo "Unity Ads plugin found:"
            echo "$UNITY_PLUGIN_PATH"

            if [ -d "$UNITY_PLUGIN_PATH/android" ]; then

              find "$UNITY_PLUGIN_PATH/android" \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                \) \
                -print0 |
              while IFS= read -r -d '' file; do

                echo ""
                echo "Checking:"
                echo "$file"

                sed -i \
                  's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                  "$file"

              done

            fi

          else

            echo "Unity Ads plugin path not found."
            echo "Continuing..."

          fi


      # ============================================================
      # Build Release APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "============================================================"
          echo "STARTING FLUTTER RELEASE BUILD"
          echo "============================================================"

          for attempt in 1 2 3; do

            echo ""
            echo "BUILD ATTEMPT $attempt / 3"

            if flutter build apk --release; then

              echo ""
              echo "============================================================"
              echo "BUILD SUCCESSFUL"
              echo "============================================================"

              exit 0

            fi

            if [ "$attempt" -lt 3 ]; then
              echo ""
              echo "Build failed."
              echo "Waiting 20 seconds before retry..."
              sleep 20
            fi

          done

          echo ""
          echo "============================================================"
          echo "BUILD FAILED AFTER 3 ATTEMPTS"
          echo "============================================================"

          exit 1


      # ============================================================
      # Upload Release APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error