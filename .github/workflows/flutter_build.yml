name: Flutter Android Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Java 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # Flutter
      # ============================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # Install ImageMagick
      # ============================================================

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick


      # ============================================================
      # Generate Android App Icon
      #
      # Source:
      # assets/icon/app_icon.png
      #
      # Generated:
      #
      # mdpi    = 48x48
      # hdpi    = 72x72
      # xhdpi   = 96x96
      # xxhdpi  = 144x144
      # xxxhdpi = 192x192
      # ============================================================

      - name: Generate Android App Icon
        shell: bash
        run: |
          set -e

          SOURCE="assets/icon/app_icon.png"
          RES="android/app/src/main/res"

          echo "=========================================="
          echo "Checking application icon..."
          echo "=========================================="

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: App icon not found:"
            echo "$SOURCE"
            exit 1
          fi

          echo "Icon found:"
          echo "$SOURCE"

          # --------------------------------------------------------
          # Create Android mipmap directories
          # --------------------------------------------------------

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # --------------------------------------------------------
          # Generate mdpi
          # --------------------------------------------------------

          convert "$SOURCE" \
            -resize 48x48 \
            -background none \
            -gravity center \
            -extent 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          # --------------------------------------------------------
          # Generate hdpi
          # --------------------------------------------------------

          convert "$SOURCE" \
            -resize 72x72 \
            -background none \
            -gravity center \
            -extent 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          # --------------------------------------------------------
          # Generate xhdpi
          # --------------------------------------------------------

          convert "$SOURCE" \
            -resize 96x96 \
            -background none \
            -gravity center \
            -extent 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          # --------------------------------------------------------
          # Generate xxhdpi
          # --------------------------------------------------------

          convert "$SOURCE" \
            -resize 144x144 \
            -background none \
            -gravity center \
            -extent 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          # --------------------------------------------------------
          # Generate xxxhdpi
          # --------------------------------------------------------

          convert "$SOURCE" \
            -resize 192x192 \
            -background none \
            -gravity center \
            -extent 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          echo ""
          echo "=========================================="
          echo "Generated launcher icons:"
          echo "=========================================="

          find "$RES" \
            -type f \
            -name "ic_launcher.png" \
            -print


      # ============================================================
      # Decode Release Keystore
      #
      # Secret:
      # KEYSTORE_BASE64
      # ============================================================

      - name: Decode Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "Release keystore created successfully."


      # ============================================================
      # Create key.properties
      #
      # Secrets:
      # KEYSTORE_PASSWORD
      # KEY_ALIAS
      # KEY_PASSWORD
      # ============================================================

      - name: Create key.properties
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created successfully."


      # ============================================================
      # Fix Unity Ads JVM Target
      # ============================================================

      - name: Fix Unity Ads JVM target
        shell: bash
        run: |
          set -e

          UNITY_PLUGIN_PATH=$(find "$HOME/.pub-cache" \
            -type d \
            -path "*/unity_ads_plugin-*" \
            | head -n 1)

          if [ -n "$UNITY_PLUGIN_PATH" ]; then

            echo "Unity Ads plugin found:"
            echo "$UNITY_PLUGIN_PATH"

            find "$UNITY_PLUGIN_PATH/android" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print \
              -exec sed -i \
                's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
                {} \; \
              || true

          else

            echo "Unity Ads plugin path not found."
            echo "Continuing..."

          fi


      # ============================================================
      # Make Gradle executable
      # ============================================================

      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ============================================================
      # Flutter Clean
      # ============================================================

      - name: Flutter Clean
        run: flutter clean


      # ============================================================
      # Flutter Pub Get
      # ============================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ============================================================
      # Build Release APK
      # ============================================================

      - name: Build Release APK
        run: flutter build apk --release


      # ============================================================
      # Upload Release APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-world-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error