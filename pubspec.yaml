name: puzzle_world

description: Jigsaw Puzzle Game

publish_to: "none"

version: 1.0.0+1


environment:
  sdk: ">=3.12.0 <4.0.0"


dependencies:

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  confetti: ^0.8.0
  google_mobile_ads: ^6.0.0



dev_dependencies:

  flutter_test:
    sdk: flutter



flutter:

  uses-material-design: true



  assets:

    - assets/images/Puzzle/
    - assets/images/background/
    - assets/images/ui/
    - assets/images/world/
    - assets/images/rewards/
    - assets/icon/
    - assets/audio/



  fonts:

    - family: Cairo

      fonts:

        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400

        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700