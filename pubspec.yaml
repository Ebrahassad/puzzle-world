name: puzzle_world

description: Jigsaw Puzzle Game

publish_to: "none"

version: 1.0.0+1


environment:
  sdk: ">=3.12.0 <4.0.0"



dependencies:

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  shared_preferences: ^2.5.3

  audioplayers: ^6.5.0

  confetti: ^0.8.0

  google_mobile_ads: ^6.0.0

  image_picker: ^1.1.2





dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.1





flutter:
  uses-material-design: true

  assets:
    # خريطة العالم
    - assets/images/world/

    # الجزر
    - assets/images/islands/

    # صور مراحل البازل
    - assets/images/Puzzle/animals/
    - assets/images/Puzzle/cars/
    - assets/images/Puzzle/space/
    - assets/images/Puzzle/nature/
    - assets/images/Puzzle/landmarks/

    # الخلفيات
    - assets/images/background/

    # واجهة اللعبة
    - assets/images/ui/

    # المكافآت
    - assets/images/rewards/

    # الأيقونات
    - assets/icon/

    # الأصوات
    - assets/audio/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400

        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700




flutter_launcher_icons:

  android: true

  ios: false

  image_path: "assets/icon/app_icon.png"

  adaptive_icon_background: "#FFFFFF"

  adaptive_icon_foreground: "assets/icon/app_icon.png"

  min_sdk_android: 21
