name: puzzle_world

description: Jigsaw Puzzle Game

publish_to: "none"

version: 1.0.2+3

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  confetti: ^0.8.0
  image_picker: ^1.1.2
  unity_ads_plugin: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/world/
    - assets/images/islands/

    - assets/images/Puzzle/animals/
    - assets/images/Puzzle/cars/
    - assets/images/Puzzle/space/
    - assets/images/Puzzle/nature/
    - assets/images/Puzzle/landmarks/

    - assets/images/background/
    - assets/images/ui/
    - assets/images/rewards/
    - assets/icon/
    - assets/audio/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700